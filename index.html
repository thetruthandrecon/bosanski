dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 6N – Notice","items":["List the means of transport in the dialogue. Do any of them have \"sa\" in front?","Find the people Mirsad does things with. What ending do they take?","\"Auto ostavljam ženi\" – which case is ženi, and which unit taught it?"],"key":["autom, tramvajem, autobusom, pješke – none has sa; means of transport take the bare instrumental.","sa ženom, sa prijateljima, sa bendom, sa mnom – instrumental after sa.","Dative (Unit 5) – the car is left \"to\" the wife."]},{"t":"ex","title":"Exercise 6S – Say it again: change the words in the dialogue","items":["Adam goes by bus and leaves the car to his brother: \"Ne, ___. Auto ostavljam ___.\"","Mirsad goes by bike and sometimes by taxi: \"Ja idem ___, a ponekad ___.\"","Mirsad goes to the market with his daughter and drinks coffee with the neighbours: \"Subotom idem na pijacu sa ___, a nedjeljom pijem kafu sa ___.\"","Adam invites Mirsad to come with them (mi): \"Dođi ___ na probu.\""],"key":["Ne, autobusom. Auto ostavljam bratu.","Ja idem biciklom, a ponekad taksijem.","Subotom idem na pijacu sa kćerkom, a nedjeljom pijem kafu sa komšijama.","Dođi s nama na probu."]},{"t":"h2","text":"The grammar behind it"},{"t":"img","src":"diag_instrumental"},{"t":"h2","text":"The endings"},{"t":"table","header":["Noun type","Singular","Plural","Example"],"rows":[["Masculine (hard)","-om","-ima","brat → bratom → braćom; autobus → autobusom"],["Masculine (soft: c, č, ć, đ, j, lj, nj, š, ž)","-em","-ima","muž → mužem; prijatelj → prijateljem; ključ → ključem"],["Neuter","-om / -em","-ima","selo → selom; more → morem; dijete → djetetom"],["Feminine -a","-om","-ama","žena → ženom; kćerka → kćerkom; gitara → gitarom"],["Feminine consonant","-i (or -ju)","-ima","stvar → stvari; noć → noći / noću; ljubav → ljubavlju"]]},{"t":"note","text":"Adjectives: masculine/neuter -im (dobrim, novim), feminine -om (dobrom, novom). Possessives: moj → mojim, moja → mojom, naš → našim, naša → našom. Pronouns: sa mnom (with me), s tobom, s njim, s njom, s nama, s vama, s njima."},{"t":"h2","text":"Two uses – and the one big rule"},{"t":"p","text":"1.  Company: sa (or s) + instrumental. Idem sa ženom. Pijem kafu sa prijateljem. Sviram sa bendom."},{"t":"p","text":"2.  Means or tool: NO preposition. Idem autobusom (by bus). Pišem olovkom (with a pencil). Putujem avionom (by plane). Sviram prstima (with my fingers)."},{"t":"note","text":"The big rule: sa = accompanied by a person or thing; no sa = using it as a tool. \"Idem sa autobusom\" means the bus is your companion. Say \"Idem autobusom.\""},{"t":"h2","text":"Other uses"},{"t":"p","text":"1.  Prepositions with the instrumental: pred (in front of), za (behind, at a table: za stolom), pod (under), među (among), nad (above). Sjedimo za stolom. Pod mostom je rijeka."},{"t":"p","text":"2.  Time of day: noću (at night), danju (by day) are bare instrumentals used as adverbs. Days of the week too: subotom (on Saturdays), nedjeljom (on Sundays), vikendom (at weekends)."},{"t":"h2","text":"Vocabulary"},{"t":"vocab","rows":[["autobus (m)","bus"],["bend (m)","band"],["tramvaj (m)","tram"],["prst, prsta (m)","finger"],["voz (m)","train"],["ruka (f)","hand"],["avion (m)","plane"],["sto, stola (m)","table"],["taksi (m)","taxi"],["most, mosta (m)","bridge"],["bicikl (m)","bicycle"],["zajedno","together"],["pješke","on foot (adverb)"],["sam / sama","alone (m/f)"],["olovka (f)","pencil"],["ljubav (f)","love"],["telefon (m)","phone"],["sreća (f)","happiness / luck"],["kompjuter (m)","computer"],["bubnjar (m)","drummer"],["pjevačica (f)","singer (f)"],["proba (f)","rehearsal"],["studio (m)","studio"],["bubnjevi (m, plural)","drums"],["viljuška (f)","fork"],["nož, noža (m)","knife"],["lopta (f)","ball"],["razgovarati, razgovaram","to talk (with)"],["ostavljati, ostavljam","to leave (something)"]]},{"t":"h3","text":"Words for talking · Travel"},{"t":"vocab","rows":[["putovanje (n)","journey, trip"],["putovati, putujem","to travel"],["pasoš (m)","passport"],["kofer (m)","suitcase"],["ranac, ranca (m)","backpack"],["granica (f)","border"],["hotel (m)","hotel"],["soba (f)","room"],["rezervacija (f)","reservation"],["odmor (m)","holiday, rest"],["plaža (f)","beach"],["izlet (m)","day trip"],["mapa (f)","map"],["turist (m)","tourist"],["vodič (m)","guide"],["stići, stignem","to arrive"],["krenuti, krenem","to set off"]]},{"t":"ex","title":"Exercise 6A – Put the noun in the instrumental (add sa only if needed)","items":["Pijem kafu ___ (žena).","Idem na fakultet ___ (tramvaj).","Sviram ___ (bend) u subotu.","Putujem u Ameriku ___ (avion).","Šetam ___ (djeca) pored rijeke.","Pišem pjesmu ___ (olovka).","Razgovaram ___ (prijatelj) o muzici.","Vozim se ___ (auto) u Mostar.","Sjedim za ___ (sto) i učim.","Živim ___ (porodica) u Ilidži.","Zovem brata ___ (telefon).","Idem ___ (bubnjar) na probu. (proba = rehearsal)"],"key":["sa ženom","tramvajem","sa bendom","avionom","sa djecom","olovkom","sa prijateljem","autom","stolom","sa porodicom","telefonom","sa bubnjarom"]},{"t":"ex","title":"Exercise 6B – Correct the errors (some sentences are correct)","items":["Idem sa autobusom u grad.","Pijem kafu sa moj muž.","Sviram gitarom.","Putujem sa avionom.","Idem u kino sa ženom i djecom.","Razgovaram sa mojom sestrom.","Pišem sa olovkom."],"key":["Idem autobusom u grad.","Pijem kafu sa (svojim) mužem.","Sviram gitaru. (accusative – you play the guitar, you don't play \"by means of\" it)","Putujem avionom.","Correct.","Correct.","Pišem olovkom."]},{"t":"ex","title":"Exercise 6C – Translate into Bosnian","items":["I am going to Sarajevo by tram.","I drink coffee with my wife every morning.","I am playing with the band on Saturday.","I travel to Florida by plane twice a year. (twice a year = dva puta godišnje)","I am talking with my neighbour.","We are sitting at the table and eating.","Come with me! (come = dođi)","I write songs with a pencil, not with a computer.","Are you going with us? (with us = s nama)","My son plays with his friends in the park. (his = svojim)"],"key":["Idem u Sarajevo tramvajem.","Pijem kafu sa ženom svako jutro.","Sviram sa bendom u subotu.","Putujem u Floridu avionom dva puta godišnje.","Razgovaram sa komšijom.","Sjedimo za stolom i jedemo.","Dođi sa mnom!","Pišem pjesme olovkom, a ne kompjuterom.","Ideš li s nama? / Da li ideš s nama?","Moj sin se igra sa svojim prijateljima u parku."]},{"t":"ex","title":"Exercise 6D – Match: sa or no sa? Pair each verb with its natural instrumental and decide","items":["Match: 1. putujem   2. jedem   3. pričam   4. pišem   5. idem na kafu   6. plaćam (I pay)"],"key":["putujem–c vozom (no sa), jedem–d viljuškom (no sa), pričam–a sa komšinicom, pišem–e olovkom (no sa), idem na kafu–f sa prijateljima, plaćam–b karticom (no sa)"],"intro":"Choose from: a. komšinicom   b. karticom (card)   c. vozom   d. viljuškom   e. olovkom   f. prijateljima"},{"t":"ex","title":"Exercise 6E – Complete the dialogue: planning a trip","items":["Emir: Kako putujete u Mostar? ___ (auto)?","Adam: Ne, ___ (voz). Djeca vole voz.","Emir: Idete sa ___ (cijela porodica)? (whole = cijela)","Adam: Da, i sa ___ (Aminina sestra). (Amina's sister – Aminina sestra)","Emir: A ja idem na more sa ___ (prijatelji), ___ (autobus).","Adam: Sretan put! Javi se ___ (telefon) kad stigneš."],"key":["Autom","vozom","cijelom porodicom","Amininom sestrom","prijateljima, autobusom","telefonom"]},{"t":"note","text":"Putting it together. You now have four cases, the past of biti and ići, and a preview of the future. That is enough for a real paragraph: Jučer sam išao autobusom u grad sa ženom. Bili smo kod njene sestre. Sutra ću ići tramvajem na fakultet. Try writing three sentences like these about your own week before you go on.","label":"Preview"},{"t":"culture","title":"Tramvajem","text":"Sarajevo had one of the first electric trams in Europe (a horse tram from 1885, electric from 1895) – it served as a test line for Vienna. The tram from Ilidža to Baščaršija is still the way most of the city moves, which is why \"idem tramvajem\" is one of the most useful instrumentals you will ever learn."},{"t":"h2","text":"Reading – Proba"},{"t":"p","text":"Subotom imam probu sa bendom. Idem tramvajem do centra, a onda pješke do studija, jer je studio u maloj ulici iza Katedrale. Sviram gitaru, a moj prijatelj Emir svira bubnjeve. Naša pjevačica Lejla dolazi autom sa svojim bratom, koji svira bas. Vježbamo tri sata: sevdalinke, nekoliko naših pjesama i jednu staru pjesmu koju svi znaju. Poslije probe idemo na kafu sa bubnjarom i pjevačicom u kafanu pored studija. Razgovaramo o koncertu u Zenici i o novim pjesmama. Kući se vraćam autobusom, jer tramvaj subotom kasno ne vozi često. Na putu kupujem kolač za ženu i sok za djecu. Navečer sjedimo zajedno za stolom, jedemo i pričamo o danu. Amina me pita: \"S kim si bio na kafi?\" Ja kažem: \"Sa bendom, kao i uvijek.\"","italic":true},{"t":"ex","title":"Exercise 6F – Answer","items":["How does he get to the centre? And to the studio?","Who plays what in the band?","How does Lejla get to rehearsal, and with whom?","What do they talk about over coffee?","Why does he take the bus home?","Find every instrumental in the text (there are at least 10). Which ones use sa and which don't – and why?"],"key":["By tram to the centre, then on foot to the studio.","Adam guitar, Emir drums, Lejla sings, her brother plays bass.","By car, with her brother.","The concert in Zenica and the new songs.","The tram doesn't run often late on Saturdays.","sa bendom (company), tramvajem (means), autom (means), sa svojim bratom (company), sa bubnjarom (company), pjevačicom (company, sa carries over), autobusom (means), za stolom (preposition za), S kim (company), Sa bendom (company)."]},{"t":"ex","title":"Extra practice – Mixed review","items":["Idem na posao ___ (bicikl), a žena ide ___ (auto).","Pričam ___ (komšinica) o ___ (vrijeme).","Djeca se igraju ___ (lopta – ball) ispred ___ (kuća).","Pišem ___ (ruka), ne ___ (kompjuter).","Translate: \"I am going to Mostar with my brother by train.\"","Translate: \"Sit with us!\" (sjedi)","Translate: \"I eat with a fork and a knife.\" (viljuška, nož)","Translate: \"She lives with her parents.\"","Translate: \"The bridge is above the river.\" (nad + instrumental)","Fix: \"Idem sa tramvajem sa moj prijatelj.\""],"key":["biciklom, autom","sa komšinicom, o vremenu","loptom, kuće","rukom, kompjuterom","Idem u Mostar sa bratom vozom.","Sjedi s nama!","Jedem viljuškom i nožem.","Ona živi sa roditeljima.","Most je nad rijekom.","Idem tramvajem sa svojim prijateljem."]},{"t":"ex","title":"From earlier units – Units 1–5","items":["Dative: Dajem knjigu ___ (brat).","Locative: Živim u ___ (Amerika).","Genitive: Nemam ___ (novac).","Accusative: Čekam ___ (sestra).","Sviđa ___ se ova pjesma. (her)"],"key":["bratu","Americi","novca","sestru","joj"]},{"t":"ex","title":"Exercise 6G – About you","items":["About you. Write five sentences: how you get to work or school (Idem … -om), who you drink coffee with, who you live with, what you write with (olovkom / kompjuterom), and one thing you do at the weekend with someone (Vikendom … sa …)."],"key":["Free writing. Check: sa only for company; soft consonants take -em (mužem, prijateljem)."]},{"t":"mistakes","items":["Adding sa to means of transport: \"Idem sa autobusom\" → Idem autobusom.","Leaving the noun after sa unchanged: \"sa moja žena\" → sa mojom ženom.","Wrong soft-consonant ending: \"sa mužom\" → sa mužem; \"sa prijateljom\" → sa prijateljem."]},{"t":"cando","items":["say who you drink coffee with","say how you get to work","say \"come with me\", \"with him\", \"with her\", \"with us\"","say \"I play with the band on Saturdays\""]}]},{"id":"7","title":"The Past Tense","full":"Unit 7 – biti + the L-participle · second position","blocks":[{"t":"p","text":"Most A1 learners already know sam / si / je / smo / ste / su; the piece usually missing is the participle. The past tense is two words: the present of biti + the \"L-participle\"."},{"t":"objectives","items":["Form the past tense with biti + L-participle","Use the fourteen most common irregular participles","Put sam / si / je in second position","Ask and answer questions about yesterday and last week"]},{"t":"h2","text":"Start here – Šta si radio jučer? (What did you do yesterday?)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Emir","Šta si radio jučer? Zvao sam te."],["Adam","Izvini, bio sam u Mostaru sa porodicom."],["Emir","Kako je bilo?"],["Adam","Odlično. Prošetali smo po Starom mostu i jeli ćevape. Djeca su htjela skočiti u Neretvu!"],["Emir","Jesu li skočili?"],["Adam","Nisu. Rekao sam da je voda prehladna. Vratili smo se kasno i odmah zaspali."]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 7N – Notice","items":["Find every past-tense verb. Which word carries the person (I/you/we) – the participle or the little word next to it?","Adam says \"bio sam\", Emir says \"zvao sam te\". Where does \"sam\" stand in each sentence?","\"Djeca su htjela skočiti\" – why htjela and not htjeli?"],"key":["The auxiliary sam/si/je carries the person; the participle carries gender and number.","Second position in both: \"Bio sam…\", \"Zvao sam te\" – after the first word.","djeca takes feminine-singular-shaped endings: htjela."]},{"t":"ex","title":"Exercise 7S – Say it again: change the words in the dialogue","items":["Emir asks what Adam did last week: \"Šta si radio ___ ___?\"","Adam was in Zenica with the band: \"Bio sam u ___ sa ___.\"","They played for two hours and ate pizza (pica): \"___ smo dva sata i ___ picu.\"","The children wanted to swim in the sea: \"Djeca su htjela ___ u ___.\"","Adam says he was too tired: \"Rekao sam da sam ___ preumoran.\""],"key":["Šta si radio prošle sedmice?","Bio sam u Zenici sa bendom.","Svirali smo dva sata i jeli picu.","Djeca su htjela plivati u moru.","Rekao sam da sam bio preumoran."]},{"t":"h2","text":"The grammar behind it"},{"t":"img","src":"diag_past"},{"t":"h2","text":"Step 1 – Make the participle"},{"t":"p","text":"Take the infinitive, remove -ti, and add:"},{"t":"table","header":["Subject","Ending","raditi","pjevati (to sing)","učiti"],"rows":[["he (m. sing.)","-o","radio","pjevao","učio"],["she (f. sing.)","-la","radila","pjevala","učila"],["it (n. sing.)","-lo","radilo","pjevalo","učilo"],["they (m. or mixed)","-li","radili","pjevali","učili"],["they (all f.)","-le","radile","pjevale","učile"],["they (n.)","-la","radila","pjevala","učila"]]},{"t":"note","text":"The participle agrees with the GENDER of the subject, not the person. \"I worked\" is radio sam if you are a man, radila sam if a woman. \"We worked\" is radili smo. Djeca (children) counts as plural feminine-ish: djeca su spavala."},{"t":"h2","text":"Step 2 – Irregular participles (learn these – they are the most common verbs)"},{"t":"table","header":["Infinitive","Meaning","m / f / pl"],"rows":[["biti","to be","bio / bila / bili"],["ići","to go","išao / išla / išli"],["doći","to come","došao / došla / došli"],["otići","to leave","otišao / otišla / otišli"],["moći","to be able","mogao / mogla / mogli"],["htjeti","to want","htio / htjela / htjeli"],["jesti","to eat","jeo / jela / jeli"],["reći","to say","rekao / rekla / rekli"],["živjeti","to live","živio / živjela / živjeli"],["vidjeti","to see","vidio / vidjela / vidjeli"],["voljeti","to love","volio / voljela / voljeli"],["sjesti","to sit down","sjeo / sjela / sjeli"],["naći","to find","našao / našla / našli"],["uzeti","to take","uzeo / uzela / uzeli"]]},{"t":"note","text":"Pattern: verbs in -jeti keep -je- in feminine and plural but become -io in masculine. Verbs in -ći have a stem change (išao, došao, rekao, mogao)."},{"t":"h2","text":"Step 3 – Word order: the \"second position\" rule"},{"t":"p","text":"The short forms sam, si, je, smo, ste, su are clitics: they must sit in the SECOND position of the sentence, after the first word or phrase. This is why \"Mi smo jeli\" and \"Jeli smo\" are both right, but \"Smo jeli\" is impossible."},{"t":"table","header":["Correct","Wrong"],"rows":[["Ja sam radio. / Radio sam.","Sam radio."],["Jučer sam radio.","Jučer radio sam."],["Moja žena je kuhala.","Moja je žena kuhala. (grammatical but unusual)"],["Ona je bila bolesna.","Ona bila je bolesna."]]},{"t":"h2","text":"Negation and questions"},{"t":"p","text":"Negative: nisam, nisi, nije, nismo, niste, nisu + participle. Nisam radio. Nije došla. Nismo jeli."},{"t":"p","text":"Questions: Da li si radio? OR Jesi li radio? (jesam, jesi, jeste, jesmo, jeste, jesu are the long forms). Šta si radio jučer? Gdje ste bili?"},{"t":"h2","text":"Time words"},{"t":"table","header":["Bosnian","English","Bosnian","English"],"rows":[["jučer","yesterday","davno","long ago"],["prekjučer","day before yesterday","nedavno","recently"],["sinoć","last night","već","already"],["jutros","this morning","još","still / yet"],["prošle sedmice","last week","nikad","never"],["prošlog mjeseca","last month","uvijek","always"],["prošle godine","last year","onda","then"],["prije dva dana","two days ago","",""]]},{"t":"h2","text":"Vocabulary"},{"t":"vocab","rows":[["jučer","yesterday"],["prekjučer","day before yesterday"],["sinoć","last night"],["jutros","this morning"],["prošle sedmice","last week"],["prošlog mjeseca","last month"],["prošle godine","last year"],["prije dva dana","two days ago"],["davno","long ago"],["nedavno","recently"],["već","already"],["još","still / yet"],["nikad","never"],["uvijek","always"],["onda","then"],["kuhati, kuham","to cook"],["spavati, spavam","to sleep"],["pjevati, pjevam","to sing"],["učiti, učim","to learn, study"],["vježbati, vježbam","to practise"],["ustati, ustanem","to get up"],["skočiti, skočim","to jump"],["plivati, plivam","to swim"],["vratiti se, vratim se","to return"],["zaspati, zaspim","to fall asleep"],["medvjed (m)","bear"],["koncert (m)","concert"],["ponoć (f)","midnight"]]},{"t":"h3","text":"Words for talking · Daily routine"},{"t":"vocab","rows":[["buditi se, budim se","to wake up"],["ustajati, ustajem","to get up"],["umivati se, umivam se","to wash (face)"],["tuširati se, tuširam se","to shower"],["oblačiti se, oblačim se","to get dressed"],["doručkovati, doručkujem","to have breakfast"],["ići na posao","to go to work"],["pauza (f)","break"],["odmarati se, odmaram se","to rest"],["čistiti, čistim","to clean"],["prati, perem","to wash"],["gledati televiziju","to watch TV"],["ići u krevet","to go to bed"],["rano","early"],["kasno","late"],["obično","usually"],["ponekad","sometimes"]]},{"t":"ex","title":"Exercise 7A – Write the past tense (the speaker is male)","items":["Jučer ___ (ja, raditi) cijeli dan.","Moja žena ___ (kuhati) pitu.","Djeca ___ (spavati) do devet.","Mi ___ (ići) u Mostar prošle sedmice.","Ti ___ (biti) na koncertu?","Oni ___ (doći) kasno.","Ja ___ (svirati) gitaru tri sata.","Moj sin ___ (vidjeti) medvjeda na planini. (medvjed = bear)","Vi ___ (jesti) ćevape?","Ona ___ (htjeti) ići kući.","Ja ___ (moći) doći.","Mi ___ (živjeti) u Floridi deset godina.","Ja ne ___ (razumjeti) profesora. (razumjeti → razumio)","Moje kćerke ___ (pjevati) na školskoj priredbi. (priredba = school show)"],"key":["sam radio","je kuhala","su spavala","smo išli","si bio","su došli","sam svirao","je vidio","ste jeli","je htjela","sam mogao","smo živjeli","nisam razumio","su pjevale"]},{"t":"ex","title":"Exercise 7B – Fix the word order","items":["Sam jučer išao u grad.","Jučer išao sam u grad.","Mi smo jeli smo pitu.","Ona bila je umorna.","Su došli kasno.","Ne sam razumio."],"key":["Jučer sam išao u grad. / Išao sam jučer u grad.","Jučer sam išao u grad.","Mi smo jeli pitu. / Jeli smo pitu.","Ona je bila umorna. / Bila je umorna.","Došli su kasno. / Oni su došli kasno.","Nisam razumio."]},{"t":"ex","title":"Exercise 7C – Translate into Bosnian","items":["Yesterday I played guitar with the band.","My wife was at work.","The children ate lunch at school.","We went to Mostar last week.","I didn't understand the professor.","Did you see my keys? (informal)","I lived in New York for five years.","She said that the water was cold. (that = da)","We drank coffee and talked about music.","I came to Bosnia two years ago.","Where were you last night? (formal)","I couldn't come to the rehearsal."],"key":["Jučer sam svirao gitaru sa bendom.","Moja žena je bila na poslu.","Djeca su jela ručak u školi.","Išli smo u Mostar prošle sedmice.","Nisam razumio profesora.","Jesi li vidio moje ključeve? / Da li si vidio moje ključeve?","Živio sam u Njujorku pet godina.","Rekla je da je voda bila hladna. (or: da je voda hladna)","Pili smo kafu i pričali o muzici.","Došao sam u Bosnu prije dvije godine.","Gdje ste bili sinoć?","Nisam mogao doći na probu."]},{"t":"ex","title":"Exercise 7D – Past tense: conjugate for every person. Give masculine and feminine where they differ.","items":["biti: ja, ti, on, ona, mi, vi, oni, one","raditi","ići","htjeti","Negative of biti: ja, ti, on, mi, vi, oni (+ bio/bila/bili)"],"key":["bio sam / bila sam, bio si / bila si, bio je, bila je, bili smo, bili ste, bili su, bile su","radio sam / radila sam, radio si / radila si, radio je, radila je, radili smo, radili ste, radili su, radile su","išao sam / išla sam, išao si / išla si, išao je, išla je, išli smo, išli ste, išli su, išle su","htio sam / htjela sam, htio si / htjela si, htio je, htjela je, htjeli smo, htjeli ste, htjeli su, htjele su","nisam, nisi, nije, nismo, niste, nisu"]},{"t":"ex","title":"Exercise 7E – Match the infinitive to its masculine participle","items":["Match: 1. ići   2. jesti   3. reći   4. moći   5. vidjeti   6. naći   7. doći   8. uzeti"],"key":["ići–c, jesti–e, reći–a, moći–g, vidjeti–h, naći–b, doći–f, uzeti–d"],"intro":"Choose from: a. rekao   b. našao   c. išao   d. uzeo   e. jeo   f. došao   g. mogao   h. vidio"},{"t":"ex","title":"Exercise 7F – Complete the dialogue: Monday morning (Amina is speaking to Adam)","items":["Amina: Gdje ___ ___ sinoć? (you were – to a man)","Adam: ___ ___ na probi. (I was)","Amina: A poslije? Zvala ___ te u deset. (I called)","Adam: Poslije probe ___ ___ na kafu sa bendom. (we went)","Amina: Djeca ___ ___ do jedanaest. Nisu mogla spavati. (waited – čekati)","Adam: Žao mi je. Nisam ___ poruku. (saw – vidjeti)"],"key":["si bio","Bio sam","sam","smo išli / smo otišli","su čekala","vidio"]},{"t":"culture","title":"Sevdalinka","text":"Sevdalinke are the traditional urban love songs of Bosnia – slow, ornamented, melancholic, usually sung to saz or accordion. The word sevdah comes from Arabic sawda via Turkish and means a love-longing you cannot cure. Most are in the past tense; they are excellent listening practice for this unit."},{"t":"h2","text":"Reading – Koncert"},{"t":"p","text":"Prošle subote sam imao koncert u Sarajevu. Ustao sam rano i vježbao sam gitaru dva sata, jer sam bio nervozan. Žena je odvezla djecu kod bake, a onda smo zajedno otišli u grad tramvajem. Prije koncerta smo jeli u malom restoranu pored rijeke i pili čaj, ne kafu – Amina je rekla da sam već dovoljno nervozan. Koncert je počeo u devet. Sala je bila puna. Svirali smo dva sata, a ljudi su pjevali s nama, posebno stare sevdalinke. Jedna starija žena je plakala kad smo svirali \"Emina\". Poslije koncerta smo jeli ćevape na Baščaršiji sa bendom. Emir je rekao da je to bio naš najbolji koncert. Vratili smo se kući poslije ponoći. Bio sam umoran, ali nisam mogao spavati od sreće. Ujutro su me djeca pitala: \"Tata, jesu li ljudi pjevali?\" Rekao sam: \"Jesu. Svi.\"","italic":true},{"t":"ex","title":"Exercise 7G – Answer","items":["What did he do before the concert, and why?","Where did the children go, and how did Adam and Amina get to town?","Why did they drink tea, not coffee?","What happened during \"Emina\"?","What did Emir say afterwards?","Why couldn't he sleep?","Rewrite the first three sentences as if a woman is speaking."],"key":["Got up early and practised guitar for two hours because he was nervous.","To grandma's; by tram.","Amina said he was already nervous enough.","An older woman cried.","That it was their best concert.","From happiness (od sreće).","Prošle subote sam imala koncert u Sarajevu. Ustala sam rano i vježbala sam gitaru dva sata, jer sam bila nervozna. Muž je odvezao djecu kod bake, a onda smo zajedno otišli u grad tramvajem."]},{"t":"ex","title":"Extra practice – Mixed review","items":["Prošle godine ___ (mi, putovati) u Tursku.","Jučer ___ (ona, kupiti) novi telefon.","Djeca ___ (naučiti) pjesmu za školu.","Gdje ___ (vi, biti) sinoć?","___ (ti, vidjeti) film? – Nisam, ___ (spavati).","Translate: \"I was born in America.\" (roditi se → rođen sam / rođena sam)","Translate: \"We lived in Tuzla for three years, then we moved to Sarajevo.\" (preseliti se)","Translate: \"He didn't come because he was ill.\" (bolestan)","Translate: \"Did you like the concert?\" (informal; sviđati se, past: svidio se)","Fix: \"Sam bio umoran i sam išao spavati.\""],"key":["smo putovali","je kupila","su naučila","ste bili","Jesi li vidio / Da li si vidio film? – Nisam, spavao sam.","Rođen sam u Americi. (f: Rođena sam)","Živjeli smo u Tuzli tri godine, a onda smo se preselili u Sarajevo.","Nije došao jer je bio bolestan.","Je li ti se svidio koncert? / Da li ti se svidio koncert?","Bio sam umoran i išao sam spavati."]},{"t":"ex","title":"From earlier units – Units 1–6","items":["Instrumental: Idem ___ (tramvaj) sa ___ (žena).","Dative: Pomažem ___ (komšija).","Locative: Radim na ___ (fakultet).","Genitive: Poslije ___ (ručak).","Accusative: Volim ___ (svoja djeca)."],"key":["tramvajem, sa ženom","komšiji","fakultetu","ručka","svoju djecu"]},{"t":"ex","title":"Exercise 7H – About you","items":["About you. Write six sentences about yesterday: when you got up (Ustao/Ustala sam u…), what you ate, where you went and how, who you talked to, what you did in the evening, and one thing you didn't do (Nisam…)."],"key":["Free writing. Check: participle matches your gender; sam/si/je in second position; nisam for negatives."]},{"t":"mistakes","items":["Putting the clitic first: \"Sam radio\" → Radio sam / Ja sam radio.","Regularising irregular verbs: writing \"idio\" for išao, \"jestio\" for jeo or \"rećio\" for rekao. Learn the table in this unit.","Forgetting gender agreement: a woman says radila sam, never radio sam."]},{"t":"cando","items":["say what you did yesterday in five sentences","ask a friend where they were last night","use išao, došao, bio, jeo and rekao correctly","say \"I couldn't come\" and \"I didn't understand\""]}]},{"id":"8","title":"The Future Tense","full":"Unit 8 – ću, ćeš, će + infinitive","blocks":[{"t":"p","text":"The future is one pattern, no exceptions: a short form of htjeti (to want) + the infinitive."},{"t":"objectives","items":["Form the future with ću, ćeš, će + infinitive","Use both word orders: Ja ću raditi / Radit ću","Make future questions and negatives","Talk about plans for tomorrow, the weekend and next year"]},{"t":"h2","text":"Start here – Planovi za vikend (Weekend plans)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Amina","Šta ćemo raditi za vikend?"],["Adam","U subotu ću imati probu, ali u nedjelju sam slobodan."],["Amina","Onda ćemo ići na Vrelo Bosne. Djeca će se voziti fijakerom."],["Adam","Hoćeš li pozvati tvoju sestru?"],["Amina","Nazvat ću je večeras. Ako bude lijepo vrijeme, doći će."],["Adam","Ja ću ponijeti gitaru. Bit će lijep dan, ako Bog da."]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 8N – Notice","items":["Underline every ću/ćeš/će/ćemo. What always comes right before it?","Find \"Nazvat ću je\" and \"ja ću ponijeti\". Why is the infinitive shortened in one but not the other?","What does \"ako Bog da\" add to the sentence?"],"key":["A word or phrase – ću never starts a sentence (Šta ćemo, U subotu ću, Onda ćemo, Djeca će).","\"Nazvat ću\" – verb first, so -i drops; \"ja ću ponijeti\" – ja comes first, so the infinitive stays whole.","God willing – a soft hedge on any future plan, like English \"hopefully\"."]},{"t":"ex","title":"Exercise 8S – Say it again: change the words in the dialogue","items":["Sunday is not free – Monday is: \"U ___ ću imati probu, ali u ___ sam slobodan.\"","They will go to the mountain (planina) and the children will ride horses (jahati konje): \"Onda ćemo ići na ___. Djeca će ___.\"","Amina will call her brother tonight: \"Nazvat ću ___ večeras.\"","Adam will bring food (hrana): \"Ja ću ponijeti ___.\""],"key":["U nedjelju ću imati probu, ali u ponedjeljak sam slobodan.","Onda ćemo ići na planinu. Djeca će jahati konje.","Nazvat ću ga večeras.","Ja ću ponijeti hranu."]},{"t":"h2","text":"The grammar behind it"},{"t":"table","header":["Person","Short form","Long form (for emphasis / questions)","Negative"],"rows":[["ja","ću","hoću","neću"],["ti","ćeš","hoćeš","nećeš"],["on / ona / ono","će","hoće","neće"],["mi","ćemo","hoćemo","nećemo"],["vi","ćete","hoćete","nećete"],["oni / one / ona","će","hoće","neće"]]},{"t":"h2","text":"Word order – two options"},{"t":"p","text":"1.  Option 1 – something comes before ću: Ja ću raditi. Sutra ću raditi. Moja žena će kuhati."},{"t":"p","text":"2.  Option 2 – the verb comes first: the infinitive drops its final -i and ću attaches to it. Radit ću. Doći ću. Svirat ću. (Verbs in -ći keep the -ći: Doći ću, Ići ću.)"},{"t":"note","text":"Same second-position rule as the past tense. Never start a sentence with ću."},{"t":"h2","text":"Questions and negatives"},{"t":"p","text":"Questions: Hoćeš li doći? / Da li ćeš doći? / Kad ćeš doći? / Šta ćeš raditi sutra?"},{"t":"p","text":"Negative: Neću raditi. Neće doći. Nećemo ići."},{"t":"h2","text":"Time words"},{"t":"table","header":["Bosnian","English","Bosnian","English"],"rows":[["sutra","tomorrow","kasnije","later"],["prekosutra","day after tomorrow","jednog dana","one day"],["večeras","tonight","ljetos / ovog ljeta","this summer"],["sljedeće sedmice","next week","za vikend","at the weekend"],["sljedećeg mjeseca","next month","nikad","never"],["sljedeće godine","next year","možda","maybe"],["za dva dana","in two days","sigurno","definitely"],["uskoro","soon","",""]]},{"t":"h2","text":"Vocabulary"},{"t":"vocab","rows":[["sutra","tomorrow"],["prekosutra","day after tomorrow"],["večeras","tonight"],["sljedeće sedmice","next week"],["sljedećeg mjeseca","next month"],["sljedeće godine","next year"],["za dva dana","in two days"],["uskoro","soon"],["kasnije","later"],["jednog dana","one day"],["ljetos / ovog ljeta","this summer"],["za vikend","at the weekend"],["možda","maybe"],["sigurno","definitely"],["slobodan / slobodna","free (not busy)"],["fijaker (m)","horse-drawn carriage"],["pozvati, pozovem","to invite"],["nazvati, nazovem","to call (phone)"],["ponijeti, ponesem","to bring along"],["završiti, završim","to finish"],["odmarati se, odmaram se","to rest"],["praznici (m, plural)","holidays"],["seminarski rad (m)","seminar paper"],["roditeljski sastanak (m)","parents' meeting"],["kiša (f)","rain"],["hrana (f)","food"]]},{"t":"h3","text":"Words for talking · Free time"},{"t":"vocab","rows":[["slobodno vrijeme (n)","free time"],["hobi (m)","hobby"],["film (m)","film"],["serija (f)","TV series"],["muzika (f)","music"],["sport (m)","sport"],["fudbal (m)","football"],["trčati, trčim","to run"],["plivati, plivam","to swim"],["planinariti, planinarim","to hike"],["čitati, čitam","to read"],["crtati, crtam","to draw"],["kuhati, kuham","to cook"],["igrati, igram","to play (a game / sport)"],["izlaziti, izlazim","to go out"],["družiti se, družim se","to hang out"],["zabava (f)","party, fun"]]},{"t":"ex","title":"Exercise 8A – Write the future tense","items":["Sutra ___ (ja, raditi) od kuće.","Da li ___ (ti, doći) na koncert?","Moja žena ___ (kuhati) večeru.","Mi ___ (ići) u Mostar za vikend.","Djeca ___ (spavati) kod bake.","Vi ___ (svirati) sa nama?","___ (ja, zvati) te sutra. (te = you)","Ona ___ (učiti) bosanski cijelo ljeto.","Oni ne ___ (doći) na vrijeme. (use neće)","Kad ___ (ti, biti) u Sarajevu?","Sljedeće godine ___ (ja, završiti) master. (završiti = to finish)","___ (mi, vidjeti) se u subotu. (see each other = vidjet ćemo se)"],"key":["ću raditi","ćeš doći","će kuhati","ćemo ići","će spavati","ćete svirati","Zvat ću","će učiti","neće doći","ćeš biti","ću završiti","Vidjet ćemo"]},{"t":"ex","title":"Exercise 8B – Rewrite starting with the verb (Option 2)","items":["Ja ću raditi sutra.","Ja ću doći u osam.","Mi ćemo svirati u subotu.","Ona će učiti cijeli dan.","Oni će putovati u Ameriku.","Ja ću ti pomoći."],"key":["Radit ću sutra.","Doći ću u osam.","Svirat ćemo u subotu.","Učit će cijeli dan.","Putovat će u Ameriku.","Pomoći ću ti."]},{"t":"ex","title":"Exercise 8C – Translate into Bosnian","items":["Tomorrow I will work at home.","Will you come to the concert? (informal)","We will go to Mostar next week.","My wife will cook dinner tonight.","I won't be at the university on Monday. (Monday = ponedjeljak → u ponedjeljak)","What will you do this summer?","I will call you later.","The children will sleep at grandma's. (grandma = baka → kod bake)","One day I will speak Bosnian well.","We will see each other on Saturday.","When will you finish your master's? (formal)","I will definitely come."],"key":["Sutra ću raditi kod kuće.","Hoćeš li doći na koncert? / Da li ćeš doći na koncert?","Ići ćemo u Mostar sljedeće sedmice.","Moja žena će večeras kuhati večeru.","Neću biti na fakultetu u ponedjeljak.","Šta ćeš raditi ovog ljeta?","Nazvat ću te kasnije.","Djeca će spavati kod bake.","Jednog dana ću dobro govoriti bosanski.","Vidjet ćemo se u subotu.","Kad ćete završiti master?","Sigurno ću doći."]},{"t":"ex","title":"Exercise 8D – Future tense: conjugate for every person","items":["doći (verb first)","učiti (verb first, drop -i)","biti (with pronoun first)","Negative of raditi","Question with li (doći)"],"key":["doći ću, doći ćeš, doći će, doći ćemo, doći ćete, doći će","učit ću, učit ćeš, učit će, učit ćemo, učit ćete, učit će","ja ću biti, ti ćeš biti, on/ona će biti, mi ćemo biti, vi ćete biti, oni će biti","neću raditi, nećeš raditi, neće raditi, nećemo raditi, nećete raditi, neće raditi","hoću li doći, hoćeš li doći, hoće li doći, hoćemo li doći, hoćete li doći, hoće li doći"]},{"t":"ex","title":"Exercise 8E – Match the time word to the sentence it fits","items":["Match: 1. sutra   2. sljedeće godine   3. večeras   4. za dva dana   5. jednog dana   6. uskoro"],"key":["sutra–e, sljedeće godine–a, večeras–c, za dva dana–f, jednog dana–b, uskoro–d"],"intro":"Choose from: a. ___ ću završiti fakultet i naći posao.   b. ___ ću dobro govoriti bosanski.   c. ___ ćemo gledati film kod kuće.   d. Autobus će stići ___ – čekaj još malo.   e. ___ ću raditi od kuće, ne na fakultetu.   f. Koncert je ___, u petak."},{"t":"ex","title":"Exercise 8F – Complete the dialogue: inviting a friend","items":["Adam: Emire, šta ___ raditi u subotu? (you will)","Emir: Ne znam još. Zašto? — Adam: Imamo koncert. ___ li doći? (will you)","Emir: Sigurno! U koliko sati ___ početi? (it will)","Adam: U devet. ___ ___ ti kartu. (I will leave – ostaviti, verb first)","Emir: Super. ___ ___ Lejlu, možda i ona hoće. (I will call – pozvati, verb first)","Adam: Odlično. Vidimo se! ___ ___ poslije koncerta na kafu. (we will go – ići)"],"key":["ćeš","Hoćeš","će","Ostavit ću","Pozvat ću","Ići ćemo"]},{"t":"culture","title":"Ako Bog da","text":"Bosnians soften the future with \"ako Bog da\" (God willing) or \"inšallah\" the way English uses \"hopefully\": \"Doći ću sutra, ako Bog da.\" Vidimo se – see you – is usually said without any future tense at all."},{"t":"h2","text":"Reading – Sljedeća sedmica"},{"t":"p","text":"Sljedeće sedmice ću imati mnogo posla. U ponedjeljak ću biti na fakultetu cijeli dan, jer imam predavanja ujutro i sastanak s profesorom popodne. U utorak ću pisati seminarski rad o historiji Bosne – moram ga završiti do petka. U srijedu ćemo žena i ja ići na roditeljski sastanak u školu; učiteljica će nam pričati o najmlađem sinu, koji je počeo čitati. U četvrtak ću imati probu sa bendom, a u petak ćemo svirati u Zenici. Krenut ćemo autom u pet, jer koncert počinje u devet, a put traje dva sata. Za vikend ćemo se odmarati. Možda ćemo ići na Vrelo Bosne sa djecom, ako bude lijepo vrijeme. Ako bude kiše, ostat ćemo kući, gledat ćemo film i ja ću kuhati – Amina kaže da će to biti najveće iznenađenje sedmice.","italic":true},{"t":"ex","title":"Exercise 8G – Answer","items":["Why will Monday be a full day?","What will he do on Tuesday, and by when must it be finished?","What happens on Wednesday, and who is going?","Where and when will the band play, and how will they get there?","What will they do at the weekend if it rains?","Rewrite the first four sentences in the PAST tense, starting \"Prošle sedmice sam imao mnogo posla.\""],"key":["Lectures in the morning and a meeting with the professor in the afternoon.","Write a seminar paper on the history of Bosnia; by Friday.","A parents' meeting at the school; he and his wife.","In Zenica, on Friday, by car, leaving at five.","Stay home, watch a film, and Adam will cook.","Prošle sedmice sam imao mnogo posla. U ponedjeljak sam bio na fakultetu cijeli dan, jer sam imao predavanja ujutro i sastanak s profesorom popodne. U utorak sam pisao seminarski rad o historiji Bosne – morao sam ga završiti do petka. U srijedu smo žena i ja išli na roditeljski sastanak u školu; učiteljica nam je pričala o najmlađem sinu, koji je počeo čitati."]},{"t":"ex","title":"Extra practice – Mixed review","items":["Sljedeće godine ___ (mi, kupiti) kuću.","Šta ___ (vi, raditi) za praznike? (praznici = holidays)","___ (ja, napisati) ti poruku kad stignem. (stići = to arrive)","Ako bude kiše, ___ (mi, ostati) kući.","Translate: \"I will never forget this.\" (zaboraviti; this = ovo)","Translate: \"Will they come with us?\"","Translate: \"She will be a doctor one day.\"","Translate: \"I'll wait for you at the station.\" (te)","Translate: \"We won't have time tomorrow.\"","Rewrite with the verb first: \"Ja ću ti pomoći sutra.\""],"key":["ćemo kupiti","ćete raditi","Napisat ću","ćemo ostati","Nikad neću zaboraviti ovo. / Ovo nikad neću zaboraviti.","Hoće li doći s nama?","Ona će jednog dana biti doktorica / ljekarka.","Čekat ću te na stanici.","Nećemo imati vremena sutra.","Pomoći ću ti sutra."]},{"t":"ex","title":"From earlier units – Units 1–7","items":["Past: Jučer ___ (ja, ići) u grad. (male speaker)","Instrumental: Putujem ___ (voz).","Dative pronoun: Daj ___ kafu. (me)","Locative: Pričamo o ___ (muzika).","Genitive: Ovo je poklon od ___ (baka)."],"key":["sam išao","vozom","mi","muzici","bake"]},{"t":"ex","title":"Exercise 8H – About you","items":["About you. Write six sentences about next week: one per day from Monday to Friday (U ponedjeljak ću…), and one for the weekend. Use at least two Option-2 forms (Radit ću…) and one negative (Neću…)."],"key":["Free writing. Check: ću never first; -i dropped only when the verb comes first; -ći verbs keep -ći."]},{"t":"mistakes","items":["Starting a sentence with ću: \"Ću raditi sutra\" → Sutra ću raditi / Radit ću sutra.","Keeping the infinitive -i when the verb comes first: \"Raditi ću\" → Radit ću (but Doći ću – -ći verbs keep the ending).","Using the present for the future without a time word. \"Sutra radim\" is fine, but \"Radim\" alone means now."]},{"t":"cando","items":["say what you will do tomorrow and at the weekend","ask a friend if they will come","say \"I won't be at work on Monday\"","say \"we'll see each other on Saturday\""]}]},{"id":"9","title":"Aspect & Everyday Words","full":"Unit 9 – Verb pairs · modals · transport · market · weather","blocks":[{"t":"p","text":"Aspect is the part of Bosnian grammar that has no equivalent in English, so it deserves its own explanation. This unit makes it explicit, adds the modal verbs, and builds the everyday vocabulary (transport, shopping, weather) that A2 conversations need."},{"t":"objectives","items":["Choose between imperfective and perfective verbs","Use moći, morati, htjeti, trebati and smjeti","Ask for directions and buy tickets","Shop at the market and talk about prices","Talk about the weather and compare things"]},{"t":"h2","text":"Start here – Na pijaci (At the market)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Adam","Dobar dan. Koliko košta kilo paradajza?"],["Prodavač","Tri marke. Domaći, iz Hercegovine."],["Adam","Dajte mi dva kila, i pola kile sira."],["Prodavač","Izvolite. Još nešto? Jabuke su danas jeftinije nego jučer."],["Adam","Može kilo jabuka. Mogu li platiti karticom?"],["Prodavač","Nažalost, samo gotovina. Ali bankomat je pored ulaza."]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 9N – Notice","items":["Which quantities are in the genitive singular and which in the genitive plural? Why?","Find the comparative. What is it comparing?","\"Mogu li platiti karticom?\" – which case is karticom, and why no \"sa\"?"],"key":["kilo paradajza, pola kile sira, kilo jabuka – genitive after a quantity: singular for a substance (paradajz, sir), plural for countable things (jabuka = of apples). dva kila – genitive singular after 2.","jeftinije nego jučer – today's price with yesterday's.","Instrumental of means – \"by card\", so no sa."]},{"t":"ex","title":"Exercise 9S – Say it again: change the words in the dialogue","items":["Adam asks the price of a kilo of peppers (paprika): \"Koliko košta kilo ___?\"","He wants three kilos of potatoes (krompir) and a kilo of onions (luk): \"Dajte mi tri ___ ___ i kilo ___.\"","The seller says pears (kruška) are cheaper today: \"___ su danas jeftinije.\"","Adam asks if he can pay in cash: \"Mogu li platiti ___?\"","The seller says the shop is behind the entrance (iza + gen.): \"Prodavnica je ___ ___.\""],"key":["Koliko košta kilo paprike?","Dajte mi tri kila krompira i kilo luka.","Kruške su danas jeftinije.","Mogu li platiti gotovinom?","Prodavnica je iza ulaza."]},{"t":"h2","text":"The grammar behind it"},{"t":"img","src":"diag_aspect"},{"t":"h2","text":"Aspect in one paragraph"},{"t":"p","text":"Almost every Bosnian verb comes in a pair. The IMPERFECTIVE describes an ongoing, repeated, or unfinished action (I was drinking, I drink every day, I was writing). The PERFECTIVE describes a single completed action with a result (I drank it up, I wrote it and finished). Only imperfective verbs have a true present tense; perfective \"present\" forms are used for the future after \"kad\", \"ako\", \"da\"."},{"t":"table","header":["Imperfective","Perfective","Meaning","Example"],"rows":[["piti","popiti","drink","Pijem kafu. / Popio sam kafu i otišao."],["jesti","pojesti","eat","Jedem pitu. / Pojeo sam sve."],["pisati","napisati","write","Pišem pjesmu. / Napisao sam pjesmu."],["čitati","pročitati","read","Čitam knjigu. / Pročitao sam knjigu."],["učiti","naučiti","learn","Učim bosanski. / Naučio sam riječ."],["raditi","uraditi","do / work","Radim. / Uradio sam zadatak."],["kupovati","kupiti","buy","Kupujem hljeb svaki dan. / Kupio sam gitaru."],["gledati","pogledati","watch / look","Gledam film. / Pogledao sam kroz prozor."],["slušati","poslušati","listen","Slušam muziku. / Poslušao sam pjesmu."],["spavati","zaspati","sleep / fall asleep","Spavam. / Zaspao sam u deset."],["dolaziti","doći","come","Dolazim svaki dan. / Došao sam jučer."],["odlaziti","otići","leave","Odlazim u pet. / Otišao sam."],["davati","dati","give","Dajem djeci sok. / Dao sam mu ključ."],["govoriti","reći","speak / say","Govorim bosanski. / Rekao sam da."],["kuhati","skuhati","cook","Kuham. / Skuhala je pitu."],["zvati","nazvati","call","Zovem ga svaki dan. / Nazvao sam brata."],["plaćati","platiti","pay","Plaćam račune. / Platio sam kafu."],["ustajati","ustati","get up","Ustajem u sedam. / Ustao sam kasno."]]},{"t":"h2","text":"Modal verbs: can, must, want, should"},{"t":"table","header":["Verb","Present","Meaning","Example"],"rows":[["moći","mogu, možeš, može, možemo, možete, mogu","can, be able","Mogu doći sutra. Možete li mi pomoći?"],["morati","moram, moraš, mora, moramo, morate, moraju","must, have to","Moram raditi. Moraš učiti."],["htjeti","hoću, hoćeš, hoće, hoćemo, hoćete, hoće","want","Hoću spavati. Hoćeš li kafu?"],["željeti","želim, želiš, želi, želimo, želite, žele","wish, would like","Želim naučiti bosanski."],["trebati","trebam, trebaš, treba…","should / need to","Trebam ići kući. Treba mi odmor."],["smjeti","smijem, smiješ, smije…","may, be allowed","Smijem li ovdje parkirati?"],["znati","znam, znaš, zna…","know how to","Znam svirati gitaru."]]},{"t":"note","text":"After a modal you can use either the infinitive (Moram raditi) or da + present (Moram da radim). Both are correct in Bosnia; the infinitive is slightly more common. \"Would like\" politely: Htio bih / Htjela bih (m / f) + noun or infinitive: Htio bih kafu. Htjela bih rezervisati sto."},{"t":"h2","text":"Comparatives and superlatives"},{"t":"table","header":["Adjective","Comparative (-iji / -ji / irregular)","Superlative (naj-)"],"rows":[["hladan (cold)","hladniji","najhladniji"],["topao (warm)","topliji","najtopliji"],["lijep (beautiful)","ljepši","najljepši"],["dobar (good)","bolji","najbolji"],["loš (bad)","gori","najgori"],["velik (big)","veći","najveći"],["mali (small)","manji","najmanji"],["jeftin (cheap)","jeftiniji","najjeftiniji"],["skup (expensive)","skuplji","najskuplji"]]},{"t":"note","text":"Comparison: \"than\" = nego or od + genitive. Danas je hladnije nego jučer. Sarajevo je veće od Mostara. Adverb comparatives are the neuter form: hladnije, toplije, bolje."},{"t":"h2","text":"Vocabulary block 1 – Transport and getting around"},{"t":"vocab","rows":[["autobuska stanica (f)","bus station"],["lijevo","left"],["tramvajska stanica (f)","tram stop"],["desno","right"],["željeznička stanica (f)","train station"],["pravo","straight"],["aerodrom (m)","airport"],["raskrsnica (f)","crossroads"],["karta (f)","ticket"],["semafor (m)","traffic light"],["povratna karta (f)","return ticket"],["parking (m)","parking"],["vozni red (m)","timetable"],["benzinska pumpa (f)","petrol station"],["polazak, polaska (m)","departure"],["gužva (f)","traffic jam / crowd"],["dolazak, dolaska (m)","arrival"],["daleko / blizu","far / near"],["kašnjenje (n)","delay"],["skrenuti, skrenem","to turn"]]},{"t":"h2","text":"Vocabulary block 2 – Shopping and the market"},{"t":"vocab","rows":[["pijaca (f)","open market"],["gotovina (f)","cash"],["prodavnica (f)","shop"],["kartica (f)","card"],["pekara (f)","bakery"],["voće (n)","fruit"],["mesnica (f)","butcher"],["povrće (n)","vegetables"],["apoteka (f)","pharmacy"],["meso (n)","meat"],["kilo / kilogram (n / m; gen. kila / kilograma)","kilo"],["sir, sira (m)","cheese"],["pola kile","half a kilo"],["jaja (n, plural)","eggs"],["komad, komada (m)","piece"],["jabuka (f)","apple"],["kesa (f)","bag"],["paradajz (m)","tomato"],["račun (m)","receipt / bill"],["krompir (m)","potato"],["jeftino","cheap"],["luk, luka (m)","onion"],["skupo","expensive"],["paprika (f)","pepper"],["popust (m)","discount"],["kruška (f)","pear"],["bankomat (m)","ATM"],["ulaz (m)","entrance"]]},{"t":"h2","text":"Vocabulary block 3 – Weather and seasons"},{"t":"vocab","rows":[["sunčano","sunny"],["hladno","cold"],["oblačno","cloudy"],["stepen, stepena (m)","degree"],["kiša (f)","rain (pada kiša = it's raining)"],["proljeće (n)","spring"],["snijeg (m)","snow (pada snijeg)"],["ljeto (n)","summer"],["vjetar, vjetra (m)","wind"],["jesen (f)","autumn"],["magla (f)","fog"],["zima (f)","winter"],["toplo","warm"],["prognoza (f)","forecast"],["vruće","hot"],["kišobran (m)","umbrella"]]},{"t":"h3","text":"Useful sentences"},{"t":"p","text":"Gdje je autobuska stanica?   ·   Koliko košta karta do Mostara?   ·   Kad polazi sljedeći autobus?   ·   Idite pravo, pa lijevo.   ·   Ima li gužve?   ·   Koliko je daleko?   ·   Koliko košta kilo paradajza?   ·   Dajte mi pola kile sira, molim.   ·   Imate li popust?   ·   Mogu li platiti karticom?   ·   Trebam račun.   ·   To je preskupo."},{"t":"h3","text":"Words for talking · Clothes"},{"t":"vocab","rows":[["odjeća (f)","clothes"],["jakna (f)","jacket"],["kaput (m)","coat"],["košulja (f)","shirt"],["majica (f)","T-shirt"],["hlače (f, plural)","trousers"],["suknja (f)","skirt"],["haljina (f)","dress"],["cipele (f, plural)","shoes"],["čizme (f, plural)","boots"],["šal (m)","scarf"],["kapa (f)","hat, cap"],["veličina (f)","size"],["probati, probam","to try on"],["nositi, nosim","to wear"]]},{"t":"ex","title":"Exercise 9A – Choose the right verb","items":["Svaki dan ___ (kupujem / kupim) hljeb.","Jučer sam ___ (kupovao / kupio) novu gitaru.","Cijelu noć sam ___ (pisao / napisao) seminarski rad, ali nisam ga ___ (pisao / napisao).","Kad ___ (pijem / popijem) kafu, idem na posao.","Djeca ___ (spavaju / zaspu) do devet vikendom.","Sinoć su djeca ___ (spavala / zaspala) u osam.","Svaki dan ___ (učim / naučim) deset novih riječi.","Danas sam ___ (učio / naučio) riječ \"vrelo\".","Emir ___ (dolazi / dođe) na probu svake subote.","Emir je ___ (dolazio / došao) kasno sinoć.","___ (Čitam / Pročitam) knjigu o Bosni – još nisam ___ (čitao / pročitao) do kraja.","Kad ___ (radim / uradim) zadatak, ___ (gledam / pogledam) film."],"key":["kupujem","kupio","pisao, napisao","popijem","spavaju","zaspala","učim","naučio","dolazi","došao","Čitam, pročitao","uradim, gledam"]},{"t":"ex","title":"Exercise 9B – Modal verbs: translate into Bosnian","items":["I can't come tomorrow.","You have to learn the cases. (informal)","Do you want coffee? (informal)","I would like to reserve a table for two. (female speaker)","May I sit here?","We need to buy bread.","I know how to play the guitar.","She can't speak English.","Can you help me? (formal)","The children have to sleep now."],"key":["Ne mogu doći sutra.","Moraš naučiti padeže.","Hoćeš li kafu?","Htjela bih rezervisati sto za dvoje.","Smijem li sjesti ovdje?","Trebamo kupiti hljeb.","Znam svirati gitaru.","Ona ne zna govoriti engleski. / Ona ne govori engleski.","Možete li mi pomoći?","Djeca sada moraju spavati."]},{"t":"ex","title":"Exercise 9C – Translate into Bosnian","items":["Where is the bus station?","How much is a return ticket to Mostar?","Go straight, then turn right at the traffic light. (turn = skrenite)","A kilo of tomatoes and half a kilo of cheese, please.","Can I pay by card?","That is too expensive. Do you have a discount?","It's raining today. Yesterday it was sunny.","It is colder today than yesterday.","Sarajevo is bigger than Mostar, but Mostar is warmer.","Winter in Bosnia is colder than winter in Florida.","This is the best coffee in the city.","The next bus leaves in ten minutes. (minutes = minuta)"],"key":["Gdje je autobuska stanica?","Koliko košta povratna karta do Mostara?","Idite pravo, pa skrenite desno na semaforu.","Kilo paradajza i pola kile sira, molim.","Mogu li platiti karticom?","To je preskupo. Imate li popust?","Danas pada kiša. Jučer je bilo sunčano.","Danas je hladnije nego jučer.","Sarajevo je veće od Mostara, ali Mostar je topliji.","Zima u Bosni je hladnija od zime u Floridi.","Ovo je najbolja kafa u gradu.","Sljedeći autobus polazi za deset minuta."]},{"t":"ex","title":"Exercise 9D – Match the imperfective to its perfective partner","items":["Match: 1. piti   2. pisati   3. kupovati   4. dolaziti   5. spavati   6. davati   7. zvati   8. jesti"],"key":["piti–d, pisati–g, kupovati–e, dolaziti–b, spavati–h, davati–a, zvati–f, jesti–c"],"intro":"Choose from: a. dati   b. doći   c. pojesti   d. popiti   e. kupiti   f. nazvati   g. napisati   h. zaspati"},{"t":"ex","title":"Exercise 9E – Complete the dialogue: at the bus station","items":["Adam: Izvinite, ___ ___ karta do Mostara? (how much does it cost)","Prodavačica: U jednom smjeru dvadeset maraka, ___ trideset. (return – povratna)","Adam: Jednu povratnu, molim. ___ li platiti karticom? (can I)","Prodavačica: Možete. Autobus ___ za petnaest minuta, peron tri. (departs – polaziti)","Adam: Koliko ___ put? (lasts – trajati)","Prodavačica: Dva i po sata, ako nema ___. (traffic)"],"key":["koliko košta","povratna","Mogu","polazi","traje","gužve"]},{"t":"ex","title":"Exercise 9F – Write 5 sentences about your own week using at least one perfective and one imperfective verb each.","items":["Ponedjeljak:","Utorak:","Srijeda:","Subota:","Nedjelja:"],"key":["Free answer – compare with a teacher or a Bosnian speaker, then mark it yourself.","Free answer – compare with a teacher or a Bosnian speaker, then mark it yourself.","Free answer – compare with a teacher or a Bosnian speaker, then mark it yourself.","Free answer – compare with a teacher or a Bosnian speaker, then mark it yourself.","Free writing – there is no single right answer. Check every noun ending against the case chart in the Appendix."]},{"t":"culture","title":"Pijaca","text":"Every Bosnian town has a pijaca, the open market, and Sarajevo's Markale has stood in the centre since 1895. Prices are rarely fixed: asking \"Može li jeftinije?\" (can it be cheaper?) is normal, and a regular customer gets a popust without asking. Sellers will often add a fruit or two to the bag – say \"Hvala, ne treba\" if you don't want it, and \"Hvala vam\" if you do."},{"t":"h2","text":"Reading – Vrijeme i pijaca"},{"t":"p","text":"U Sarajevu su zime duge i hladne, pa ljudi kupuju drugačije nego ljeti. Zimi Adam ide na pijacu samo subotom, kupi sve za cijelu sedmicu i brzo se vraća kući, jer je često ispod nule i pada snijeg. Ljeti je drugačije. Ide na pijacu skoro svaki dan, kupuje malo – paradajz, paprike, breskve – i dugo priča sa prodavačima. Prošle subote je bilo vruće, trideset stepeni. Kupio je dva kila paradajza, ali je zaboravio kupiti sir, pa se morao vratiti. Prodavačica mu je rekla: \"Sutra će biti hladnije, dolazi kiša.\" Nije joj vjerovao, ali je ponio kišobran. Popodne je zaista pala kiša, jača nego cijelog mjeseca. Amina je rekla da je prodavačica bolja prognoza od televizije.","italic":true},{"t":"ex","title":"Exercise 9G – Answer","items":["How does Adam shop differently in winter and in summer?","What did he forget last Saturday, and what did he have to do?","What did the seller predict?","Was she right? How do you know?","Find: 3 comparatives, 2 imperfective present verbs describing habits, 3 perfective past verbs."],"key":["Winter: market only on Saturdays, buys for the whole week, hurries home. Summer: almost every day, small amounts, long chats.","Cheese; he had to go back.","It would be colder tomorrow, rain was coming.","Yes – it rained in the afternoon, harder than all month.","Comparatives: hladnije, jača, bolja. Imperfective habits: ide, kupuje, priča (also kupuju, vraća se). Perfective past: kupio je, zaboravio, rekla je, ponio, pala."]},{"t":"ex","title":"Extra practice – Mixed review","items":["Choose: Svake večeri ___ (čitam / pročitam) djeci priču. Sinoć sam ___ (čitao / pročitao) cijelu knjigu.","Choose: Moram ___ (kupovati / kupiti) karte danas. Obično ___ (kupujem / kupim) karte online.","Translate: \"Excuse me, where is the nearest pharmacy?\" (najbliža)","Translate: \"Turn left at the crossroads, then go straight.\" (skrenite)","Translate: \"How much is this? – Twenty marks.\" (marka → maraka)","Translate: \"It is snowing and it is very cold.\"","Translate: \"The weather is better today than yesterday.\"","Translate: \"Mostar is the warmest city in Bosnia.\"","Translate: \"May I open the window?\" (otvoriti)","Translate: \"I want to learn how to cook Bosnian food.\" (bosanska hrana)"],"key":["čitam, pročitao","kupiti, kupujem","Izvinite, gdje je najbliža apoteka?","Skrenite lijevo na raskrsnici, pa idite pravo.","Koliko košta ovo? – Dvadeset maraka.","Pada snijeg i veoma je hladno.","Vrijeme je danas bolje nego jučer.","Mostar je najtopliji grad u Bosni.","Smijem li otvoriti prozor?","Želim naučiti kuhati bosansku hranu."]},{"t":"ex","title":"From earlier units – Units 1–8","items":["Future: Sutra ___ (mi, ići) na pijacu.","Past: Ona ___ (kupiti) hljeb.","Instrumental: Plaćam ___ (kartica).","Genitive: kilo ___ (jabuka, plural)","Dative: Kažem ___ (prodavač) hvala."],"key":["ćemo ići","je kupila","karticom","jabuka","prodavaču"]},{"t":"ex","title":"Exercise 9H – About you","items":["About you. Write six sentences: what the weather is like where you live in winter and summer (two comparatives), what you buy at the market and how you pay, what you must do this week (Moram…), and one thing you can't do yet in Bosnian (Još ne znam…)."],"key":["Free writing. Check: comparatives with nego / od + genitive; quantities + genitive; modal + infinitive."]},{"t":"mistakes","items":["Using a perfective verb for a habit: \"Svaki dan popijem kafu\" → Svaki dan pijem kafu.","Using an imperfective for a finished result: \"Napisao sam\" says the letter is done; \"Pisao sam\" says you spent time writing.","Comparing with \"više\" instead of the comparative: \"više hladno\" → hladnije."]},{"t":"cando","items":["explain the difference between pijem and popijem","say \"I can't come\", \"I have to work\", \"may I sit here?\"","ask how much something costs and pay","ask for directions to the bus station","say that today is colder than yesterday"]}]},{"id":"10","title":"Reading & Final Test","full":"Unit 10 – Three readings · A2 assessment","blocks":[{"t":"p","text":"Three readings that use everything from Units 1–9, followed by a final test in the same format as the placement test at the front of the book. Score 20/24 or better and you are solidly A2."},{"t":"objectives","items":["Read a text of 100–130 words and answer questions on it","Write a short letter or message using past, present and future","Pass the final A2 test"]},{"t":"culture","title":"Vrelo Bosne","text":"The source of the river Bosna, at the foot of Igman in Ilidža, is where Sarajevans walk on Sundays – down the Velika aleja (the great avenue) planted in 1892, often by horse-drawn fijaker. The river gave its name to the whole country."},{"t":"h2","text":"Reading 1 – Na pijaci"},{"t":"p","text":"Subotom ujutro idem na pijacu u Ilidži sa najstarijom kćerkom. Ona voli birati voće, a ja pričam sa prodavačima. Prošle subote smo kupili dva kila jabuka, kilo paradajza i pola kile sira. Prodavač nam je dao popust jer dolazimo svake sedmice. Poslije smo sjeli u kafanu pored pijace i popili kafu – ona je, naravno, popila sok. Rekla mi je da će sljedeći put ona platiti. Nasmijao sam se.","italic":true},{"t":"ex","title":"Exercise 10A – Questions","items":["Who does he go to the market with?","What did they buy last Saturday?","Why did the seller give a discount?","What did the daughter say?","Find: 2 instrumentals, 3 genitives, 2 accusatives, 3 perfective past-tense verbs."],"key":["His eldest daughter.","Two kilos of apples, a kilo of tomatoes, half a kilo of cheese.","Because they come every week.","That next time she will pay.","Instr.: sa najstarijom kćerkom, sa prodavačima. Gen.: jabuka, paradajza, sira, pijace. Acc.: voće, dva kila, kafu, sok. Perfective past: smo kupili, je dao, smo sjeli, popili, popila, nasmijao sam se."]},{"t":"h2","text":"Reading 2 – Pismo bratu"},{"t":"p","text":"Dragi brate, kako si? Mi smo dobro. Djeca su počela školu prije dvije sedmice. Najmlađi je prvi put išao u vrtić i plakao je prvi dan, ali sada ga voli. Ja sam počeo novi semestar na fakultetu. Pišem seminarski rad o historiji Bosne – znaš da me to zanima. Bend ima koncert u Zenici sljedećeg mjeseca; svirat ćemo stare sevdalinke i nekoliko naših pjesama. Žena ti šalje pozdrave. Kad ćeš doći u Bosnu? Ljeto je najbolje vrijeme. Možemo ići na Neretvu i jesti pastrmku. Javi se. Tvoj brat.","italic":true},{"t":"ex","title":"Exercise 10B – Questions","items":["What happened to the youngest child?","What is the seminar paper about?","What will the band play in Zenica?","When does he say the brother should visit, and why?","Find every future-tense form (2) and every past-tense form (5).","Write a reply of 6–8 sentences from the brother, using at least one past, one future, and one comparison."],"key":["Went to kindergarten for the first time, cried the first day, now loves it.","The history of Bosnia.","Old sevdalinke and some of their own songs.","Summer – the best time; they can go to the Neretva and eat trout.","Future: svirat ćemo, kad ćeš doći (možemo ići is present). Past: su počela, je išao, plakao je, sam počeo, (šalje is present).","Model answer: Dragi brate, hvala na pismu. Drago mi je da su djeca dobro. Ja sam prošle sedmice radio svaki dan i bio sam umoran. Doći ću u Bosnu u julu, ako Bog da. Ljeto je sigurno toplije nego ovdje. Pozdravi Aminu i djecu. Tvoj brat."]},{"t":"h2","text":"Reading 3 – Vrijeme u Sarajevu"},{"t":"p","text":"U Sarajevu su zime duge i hladne. Često pada snijeg, a temperatura je ispod nule. Ljeta su topla, ali ne tako vruća kao u Floridi. Proljeće i jesen su najljepši – planine su zelene ili zlatne, a grad nije prepun turista. Ipak, u jesen često ima magle, posebno ujutro u Ilidži. Prognoza za sutra kaže: oblačno, sa kišom popodne, deset stepeni. Uzmite kišobran.","italic":true},{"t":"ex","title":"Exercise 10C – Questions","items":["How are Sarajevo's summers compared to Florida's?","Which seasons does the author like best, and why?","What is the forecast for tomorrow?","Write 4 sentences comparing the weather in Bosnia and Florida using comparatives."],"key":["Warm, but not as hot as in Florida.","Spring and autumn – mountains are green or golden and the city isn't full of tourists.","Cloudy, rain in the afternoon, ten degrees.","Free writing."]},{"t":"h2","text":"Final Test (A2)"},{"t":"p","text":"No dictionary, no answer key until you finish. 24 points."},{"t":"ex","title":"Part A – Cases (6 points)","items":["Idem u ___ (Mostar) sa ___ (žena).","To je gitara ___ (moj sin).","Živim u ___ (Ilidža) blizu ___ (rijeka).","Vidim ___ (prijatelj) ispred ___ (fakultet).","Pijem kafu sa ___ (bubnjar) i ___ (pjevačica).","Idem na fakultet ___ (tramvaj)."],"key":["Mostar, ženom","mog sina","Ilidži, rijeke","prijatelja, fakulteta","bubnjarom, pjevačicom","tramvajem"]},{"t":"ex","title":"Part B – Past tense (4 points)","items":["Jučer ___ (ja, doći) kasno kući.","Moja žena ___ (skuhati) večeru.","Djeca ___ (jesti) u školi.","Mi ___ (ići) u Zenicu prošle sedmice."],"key":["sam došao","je skuhala","su jela","smo išli"]},{"t":"ex","title":"Part C – Future tense (3 points)","items":["Sutra ___ (ja, svirati) sa bendom.","Kad ___ (ti, doći) u Bosnu?","Oni ne ___ (biti) na koncertu."],"key":["ću svirati","ćeš doći","neće biti"]},{"t":"ex","title":"Part D – Translate (6 points)","items":["I have been living in Bosnia for two years.","Can you help me? (formal)","It is colder in Sarajevo than in Florida.","I bought a kilo of apples and paid by card.","Where is the tram stop?","We will go to the sea in July."],"key":["Živim u Bosni dvije godine.","Možete li mi pomoći?","U Sarajevu je hladnije nego u Floridi.","Kupio sam kilo jabuka i platio karticom.","Gdje je tramvajska stanica?","Ići ćemo na more u julu."]},{"t":"ex","title":"Part E – Aspect (3 points)","items":["Svaki dan ___ (pijem / popijem) dvije kafe.","Jutros sam ___ (čitao / pročitao) novine i otišao na posao.","Cijelu noć ___ (pisao / napisao) sam rad."],"key":["pijem","pročitao","pisao"]},{"t":"ex","title":"Part F – Reading (2 points)","items":["Read: \"Prošlog ljeta smo bili na moru u Neumu. Vozili smo se četiri sata. Djeca su se kupala svaki dan, a ja sam čitao i svirao gitaru na plaži. Sljedećeg ljeta ćemo ići u Hrvatsku, jer je more tamo ljepše, ali je skuplje.\" Where did they go, how long was the drive, what did he do, and why will next year be different?"],"key":["Neum, on the coast; four-hour drive; read and played guitar on the beach; next summer Croatia, because the sea is nicer but more expensive."]},{"t":"mistakes","items":["In the readings, do not translate word by word. Find the verb first, then ask \"who?\" (nominative) and \"whom / what?\" (accusative).","In free writing, check every noun after a preposition against the case chart in the Appendix."]},{"t":"cando","items":["read all three texts without a dictionary","write a 6–8 sentence message to a friend","score 20 or more on the final test"]}]},{"id":"appendix","title":"Appendix","full":"Appendix – Reference Tables","blocks":[{"t":"h2","text":"A. The complete noun case chart"},{"t":"table","header":["Case","Masc. sing.","Fem. -a sing.","Neut. sing.","Masc. pl.","Fem. pl.","Neut. pl."],"rows":[["Nominative","grad","žena","selo","gradovi","žene","sela"],["Genitive","grada","žene","sela","gradova","žena","sela"],["Dative","gradu","ženi","selu","gradovima","ženama","selima"],["Accusative","grad (brata)","ženu","selo","gradove","žene","sela"],["Vocative","grade","ženo","selo","gradovi","žene","sela"],["Instrumental","gradom","ženom","selom","gradovima","ženama","selima"],["Locative","gradu","ženi","selu","gradovima","ženama","selima"]]},{"t":"note","text":"Feminine nouns ending in a consonant (stvar, noć, riječ): G stvari, D stvari, A stvar, I stvari / stvarju, L stvari; plural stvari, stvari, stvarima, stvari, stvarima, stvarima."},{"t":"h2","text":"A2. Masculine plurals – full reference"},{"t":"p","text":"Unit 1 gives the three-question shortcut. This table lists every pattern for when you meet a word that does not fit."},{"t":"table","header":["Pattern","Rule","Examples"],"rows":[["Long nouns (2+ syllables)","add -i","prijatelji, telefoni, kompjuteri, tramvaji, profesori, studenti"],["Short nouns, hard consonant","add -ov- + -i","gradovi, stanovi, sinovi, mostovi, satovi, vozovi, brodovi, zidovi, bogovi"],["Short nouns, soft consonant (c č ć đ j lj nj š ž)","add -ev- + -i","ključevi, muževi, krajevi, noževi, brojevi, miševi"],["Short nouns that stay short","add -i only","dani, zubi, konji, prsti, đaci, gosti, psi, crvi"],["k / g / h before -i","k → c, g → z, h → s","momci, dječaci, vojnici, orasi, uspjesi, bubrezi (never after -ov-: bogovi)"],["Fleeting -a-","the -a- before the last consonant drops","momak → momci, pas → psi, Bosanac → Bosanci, stranac → stranci, novac → novci, otac → očevi"],["Inhabitant nouns in -anin","drop -in, add -i","Sarajevanin → Sarajevani, građanin → građani; Mostarac → Mostarci"],["Nouns in -lac","-lac → -oci","čitalac → čitaoci, gledalac → gledaoci, slušalac → slušaoci"],["Masculine nouns in -a","feminine plural -e","komšija → komšije, kolega → kolege, tata → tate"],["Borrowed nouns in -o","plural -a","auto → auta, radio → radija, kino → kina"],["Collectives (feminine singular endings)","a different word","brat → braća, gospodin → gospoda, dijete → djeca; also čovjek → ljudi, oko → oči, uho → uši"],["Two accepted plurals","both correct","put → putovi / puti, znak → znakovi / znaci, vuk → vukovi / vuci"]]},{"t":"h2","text":"B. Adjective endings (dobar – good)"},{"t":"table","header":["Case","Masc.","Fem.","Neut.","Plural (m / f / n)"],"rows":[["Nominative","dobar","dobra","dobro","dobri / dobre / dobra"],["Genitive","dobrog","dobre","dobrog","dobrih"],["Dative / Locative","dobrom","dobroj","dobrom","dobrim"],["Accusative","dobar / dobrog (animate)","dobru","dobro","dobre / dobre / dobra"],["Instrumental","dobrim","dobrom","dobrim","dobrim"]]},{"t":"h2","text":"C. Possessives (moj – my; the same pattern for tvoj, svoj, naš, vaš)"},{"t":"table","header":["Case","Masc.","Fem.","Neut.","Plural (m / f / n)"],"rows":[["Nominative","moj","moja","moje","moji / moje / moja"],["Genitive","mog(a)","moje","mog(a)","mojih"],["Dative / Locative","mom(e)","mojoj","mom(e)","mojim"],["Accusative","moj / mog (animate)","moju","moje","moje / moje / moja"],["Instrumental","mojim","mojom","mojim","mojim"]]},{"t":"note","text":"njegov (his), njen / njezin (her), njihov (their) follow the adjective pattern. Svoj means \"one's own\" and refers back to the subject: Volim svoju ženu (I love my own wife) but Volim njegovu ženu (I love his wife – a different sentence!)."},{"t":"h2","text":"D. Personal pronouns"},{"t":"table","header":["","ja","ti","on / ono","ona","mi","vi","oni"],"rows":[["Genitive (long / short)","mene / me","tebe / te","njega / ga","nje / je","nas","vas","njih / ih"],["Dative (long / short)","meni / mi","tebi / ti","njemu / mu","njoj / joj","nama / nam","vama / vam","njima / im"],["Accusative (long / short)","mene / me","tebe / te","njega / ga","nju / je (ju)","nas","vas","njih / ih"],["Instrumental","mnom","tobom","njim","njom","nama","vama","njima"],["Locative","meni","tebi","njemu","njoj","nama","vama","njima"]]},{"t":"note","text":"Short forms are clitics and sit in second position. Order of clitics: question particle li → verb clitics (sam, si, ćeš…) → dative (mi, ti…) → accusative/genitive (me, ga…) → se → je. Example: \"Dao sam mu ga.\" / \"Dala mu ga je.\""},{"t":"h2","text":"E. Numbers"},{"t":"table","header":["1–10","11–20","Tens","Bigger"],"rows":[["jedan / jedna / jedno","jedanaest","deset","sto (100)"],["dva / dvije (f)","dvanaest","dvadeset","dvjesta (200), trista (300)"],["tri","trinaest","trideset","petsto (500)"],["četiri","četrnaest","četrdeset","hiljadu (1,000)"],["pet","petnaest","pedeset","milion"],["šest","šesnaest","šezdeset",""],["sedam","sedamnaest","sedamdeset",""],["osam","osamnaest","osamdeset",""],["devet","devetnaest","devedeset",""],["deset","dvadeset","sto",""]]},{"t":"note","text":"Counting rule: 1 + nominative singular (jedan grad, jedna žena); 2, 3, 4 + genitive singular (dva grada, dvije žene, tri sela); 5 and above + genitive plural (pet gradova, deset žena). Compound numbers follow their last digit: dvadeset jedan grad, dvadeset dvije žene, dvadeset pet gradova."},{"t":"h2","text":"F. Days, months, seasons, time"},{"t":"table","header":["Days (u + accusative)","Months (u + locative)","Seasons","Telling time"],"rows":[["ponedjeljak → u ponedjeljak","januar → u januaru","proljeće → u proljeće","Koliko je sati? (What time is it?)"],["utorak → u utorak","februar, mart, april","ljeto → ljeti","Jedan sat. Dva / tri / četiri sata. Pet sati."],["srijeda → u srijedu","maj, juni, juli","jesen → u jesen","Pola tri. (half past two)"],["četvrtak → u četvrtak","august, septembar","zima → zimi","Petnaest do tri. / Tri i petnaest."],["petak → u petak","oktobar, novembar","","U koliko sati? U sedam. U pola osam."],["subota → u subotu","decembar","ujutro, popodne, navečer, noću",""],["nedjelja → u nedjelju","","svaki dan, svake sedmice, svakog mjeseca",""]]},{"t":"h2","text":"G. Verb conjugation patterns (present tense)"},{"t":"table","header":["Type","Infinitive","ja","ti","on/ona","mi","vi","oni"],"rows":[["-a- verbs","imati (have)","imam","imaš","ima","imamo","imate","imaju"],["-i- verbs","raditi (work)","radim","radiš","radi","radimo","radite","rade"],["-e- verbs","pisati (write)","pišem","pišeš","piše","pišemo","pišete","pišu"],["-ova- verbs","kupovati (buy)","kupujem","kupuješ","kupuje","kupujemo","kupujete","kupuju"],["","biti (be)","sam / jesam","si / jesi","je / jest","smo / jesmo","ste / jeste","su / jesu"],["","htjeti (want)","hoću / ću","hoćeš / ćeš","hoće / će","hoćemo / ćemo","hoćete / ćete","hoće / će"],["","moći (can)","mogu","možeš","može","možemo","možete","mogu"],["","ići (go)","idem","ideš","ide","idemo","idete","idu"]]},{"t":"h2","text":"H. Modal verbs and the \"da\" construction"},{"t":"p","text":"Bosnian uses both the infinitive and \"da + present\" after modal verbs; the infinitive is a little more common in Bosnia, \"da\" a little more in Serbia, and both are correct everywhere. moći (can): Mogu doći / Mogu da dođem. morati (must): Moram raditi / Moram da radim. htjeti (want): Hoću spavati / Hoću da spavam. trebati (should / need): Trebam ići / Treba da idem. željeti (wish): Želim učiti / Želim da učim. smjeti (may, be allowed): Smijem li pušiti ovdje?"},{"t":"h2","text":"I. Prepositions and the case they take"},{"t":"table","header":["Case","Prepositions","Examples"],"rows":[["Genitive","iz, od, do, kod, bez, pored, blizu, iza, ispred, između, iznad, ispod, preko, poslije, prije, zbog (because of), umjesto (instead of)","iz grada, kod bake, bez šećera, poslije ručka, zbog kiše"],["Dative","k / ka, prema, nasuprot (opposite)","ka gradu, prema centru, nasuprot pošti"],["Accusative","u, na (motion), za (for), kroz (through), niz (down), uz (up, alongside), po (to fetch), pred/pod/nad/među (motion)","u grad, na koncert, za ženu, kroz park, idem po hljeb"],["Instrumental","s / sa, pred, pod, nad, za (behind), među (location)","sa ženom, za stolom, pod mostom, među prijateljima"],["Locative","u, na (location), o (about), po (around / after), pri (at)","u gradu, na poslu, o muzici, po gradu"]]},{"t":"note","text":"u, na, pred, pod, nad, među and za each take two cases: accusative for movement towards, instrumental or locative for a position. Idem pod most (I go under the bridge) / Stojim pod mostom (I stand under the bridge)."},{"t":"h2","text":"J. Question words"},{"t":"table","header":["Bosnian","English","Bosnian","English"],"rows":[["ko? (koga, kome, s kim…)","who?","šta? (čega, čemu, čim…)","what?"],["gdje?","where?","kuda? / kamo?","where to?"],["odakle?","where from?","kad(a)?","when?"],["zašto?","why?","kako?","how?"],["koliko?","how much / many?","koji, koja, koje?","which?"],["čiji, čija, čije?","whose?","kakav, kakva, kakvo?","what kind of?"],["da li… / …li?","(yes/no question)","zar…?","really…? (surprised)"]]},{"t":"h2","text":"K. Twenty irregular verbs you cannot avoid"},{"t":"table","header":["Infinitive","Meaning","Present (ja / oni)","Past (m / f)","Future (ja)"],"rows":[["biti","be","sam / su (jesam / jesu)","bio / bila","bit ću"],["htjeti","want","hoću / hoće","htio / htjela","—"],["moći","can","mogu / mogu","mogao / mogla","moći ću"],["ići","go","idem / idu","išao / išla","ići ću"],["doći","come","dođem / dođu","došao / došla","doći ću"],["otići","leave","odem / odu","otišao / otišla","otići ću"],["naći","find","nađem / nađu","našao / našla","naći ću"],["reći","say","reknem (kažem) / reknu","rekao / rekla","reći ću"],["jesti","eat","jedem / jedu","jeo / jela","jest ću"],["piti","drink","pijem / piju","pio / pila","pit ću"],["dati","give","dam / daju","dao / dala","dat ću"],["znati","know","znam / znaju","znao / znala","znat ću"],["uzeti","take","uzmem / uzmu","uzeo / uzela","uzet ću"],["sjesti","sit down","sjednem / sjednu","sjeo / sjela","sjest ću"],["spavati","sleep","spavam / spavaju","spavao / spavala","spavat ću"],["zvati","call","zovem / zovu","zvao / zvala","zvat ću"],["pisati","write","pišem / pišu","pisao / pisala","pisat ću"],["vidjeti","see","vidim / vide","vidio / vidjela","vidjet ću"],["živjeti","live","živim / žive","živio / živjela","živjet ću"],["razumjeti","understand","razumijem / razumiju","razumio / razumjela","razumjet ću"]]},{"t":"note","text":"Verbs in -jeti keep -je- in the feminine and plural (vidjela, vidjeli) but end in -io in the masculine (vidio). Verbs in -ći keep the whole infinitive before ću (doći ću, moći ću); all others drop the final -i (pit ću, vidjet ću)."},{"t":"h2","text":"Phrases for learning Bosnian in Bosnian"},{"t":"p","text":"Use these with every Bosnian speaker you meet – they turn a conversation into a lesson."},{"t":"vocab","rows":[["Kako se ka const settings = Object.assign({ lenient: true, font: 17 }, S.get('settings', {}));
const order = DATA.sections.map(s => s.id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => { let t = String(s).toLowerCase().replace(/\(.*?\)/g, ' ').replace(/[.!?,;:"“”'‘’]/g, ' ').replace(/\s+/g, ' ').trim(); if (settings.lenient) t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd'); return t; };
function matches(user, key) {
  if (!user.trim()) return false;
  const u = norm(user);
  const alts = String(key).split(/\s*(?:\/|\bor\b|;)\s*/).map(norm).filter(Boolean);
  if (alts.includes(u)) return true;
  // fill-in items: key may be just the missing words; accept if user's answer contains key or key contains user (for short keys)
  return alts.some(a => a.length >= 2 && (u === a || u.includes(a) || (a.includes(u) && u.length >= a.length * 0.7)));

function progressOf(id) {

}

function table(b, cls) {

function vocab(rows) {
