<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Bosanski – A Workbook for Learners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A41;--terra:#C8553D;--gold:#D9A441;--cream:#F4EFE6;--sage:#8A9A5B;--ink:#222;--muted:#6b6b6b;--ok:#3d8b5a;--bad:#c8553d;--line:#e2ddd3}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
h1,h2,h3,.serif{font-family:Lora,Georgia,serif}
header{position:sticky;top:0;z-index:10;background:var(--navy);color:var(--cream);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
header button{background:none;border:0;color:var(--cream);font-size:22px;padding:6px 8px;cursor:pointer}
header .t{font-family:Lora,serif;font-weight:700;font-size:18px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:14px 14px 90px;max-width:760px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.cover{background:var(--navy);color:var(--cream);text-align:center;padding:22px 16px}
.cover img{width:62%;max-width:280px;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.cover h1{margin:14px 0 4px;font-size:28px;letter-spacing:.04em}
.cover p{margin:0;color:#c9d0dc;font-size:15px}
.unit{display:flex;align-items:center;gap:14px;cursor:pointer}
.unit .n{width:46px;height:46px;border-radius:12px;background:var(--terra);color:#fff;font:700 22px Lora,serif;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.unit .n.alt{background:var(--navy)}
.unit .tt{flex:1}.unit .tt b{display:block;font-family:Lora,serif;font-size:17px}
.unit .tt small{color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--sage);width:0}
.banner{width:100%;border-radius:12px;display:block;margin:4px 0 14px}
h2{color:var(--navy);font-size:21px;margin:26px 0 8px}
h3{color:var(--terra);font-size:16px;margin:22px 0 6px}
p{margin:8px 0}
.note{background:#EEF1F6;border-left:4px solid var(--navy);padding:10px 12px;border-radius:6px;margin:12px 0;font-size:15.5px}
.culture{background:#EEF1E4;border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);padding:12px 14px;margin:14px 0;font-size:15.5px}
.culture b{font-family:Lora,serif;color:var(--navy)}
.box{border-left:5px solid;padding:10px 14px;border-radius:6px;margin:14px 0;font-size:15.5px}
.box .lbl{font-size:11px;letter-spacing:.12em;font-weight:700;margin-bottom:6px}
.box ul{margin:0;padding-left:18px}.box li{margin:3px 0}
.obj{background:#EEF1F6;border-color:var(--navy)}.obj .lbl{color:var(--navy)}
.mis{background:#FBEFEA;border-color:var(--terra)}.mis .lbl{color:var(--terra)}
.can{background:#FBF5E6;border-color:var(--gold)}.can .lbl{color:#9a6f1f}
.can label{display:flex;gap:8px;align-items:flex-start;margin:6px 0}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid #d9d4c9;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#EEF1F6;font-weight:700}
.vocab td:nth-child(odd){font-weight:700;background:#F7F4EE;width:38%}
.dlg td{border:0;padding:5px 6px}.dlg td:first-child{color:var(--terra);font-weight:700;white-space:nowrap;width:1%}.dlg td:last-child{font-style:italic}
.reading{font-style:italic;background:#fff;border-radius:10px;padding:12px 14px;border:1px solid var(--line);font-size:17px;line-height:1.6}
.ex{background:#fff;border-radius:14px;padding:12px 14px;margin:14px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.ex h3{margin:0 0 8px}
.item{padding:10px 0;border-top:1px solid var(--line)}
.item .q{margin-bottom:6px}.item .q .num{color:var(--terra);font-weight:700;margin-right:6px}
.item textarea{width:100%;border:1.5px solid #cfc9bd;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:1em;resize:none;background:#FBFAF7;min-height:44px}
.item textarea:focus{outline:0;border-color:var(--navy)}
.item.ok textarea{border-color:var(--ok);background:#eef7f0}.item.bad textarea{border-color:var(--bad);background:#fbf0ed}
.ans{margin-top:6px;font-size:15px;color:#333;background:#F4EFE6;padding:8px 10px;border-radius:8px;display:none}
.ans b{color:var(--navy)}
.item.show .ans{display:block}
.self{display:none;gap:8px;margin-top:6px}.item.show.bad .self{display:flex}
.self button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-size:14px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:10px;padding:12px;font-size:16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--navy);color:#fff}.btn.s{background:#EEF1F6;color:var(--navy)}
.score{font-size:14px;color:var(--muted);text-align:right;margin-top:6px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px;z-index:10}
.nav button{flex:1;border:0;background:var(--cream);border-radius:10px;padding:10px;font-size:15px;font-weight:600;color:var(--navy)}
.nav button:disabled{opacity:.4}
.kbd{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.kbd button{border:1px solid #cfc9bd;background:#fff;border-radius:8px;padding:6px 10px;font-size:17px;min-width:38px}
.settings label{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.settings input{transform:scale(1.3)}
.small{font-size:13px;color:var(--muted)}
img.diag{width:100%;border-radius:10px;margin:8px 0}
</style>
</head>

<script>
const DATA = {"sections":[{"id":"placement","title":"Placement Test","full":"Placement Test – Are You Ready for This Book?","blocks":[{"t":"p","text":"This book assumes you have finished a beginner (A1) course: you can greet people, count, use the present tense, and know the gender of common nouns. Take this test before you start. Answers are at the back. Twenty points: 15 or more means you are ready for Unit 2; 10–14 means start at Unit 1 and go slowly; under 10 means you would benefit from an A1 course first."},{"t":"ex","title":"Part A – Translate into English","items":["Dobar dan, kako ste?","Ja sam iz Amerike, ali živim u Sarajevu.","Imam troje djece.","Koliko košta ova kafa?","Ne razumijem, možete li ponoviti?"],"key":["Good day, how are you? (formal)","I am from America, but I live in Sarajevo.","I have three children.","How much does this coffee cost?","I don't understand, could you repeat?"]},{"t":"ex","title":"Part B – Translate into Bosnian","items":["My name is Adam.","I don't speak Bosnian well.","Where is the bus station?","I would like water, please.","Today is Sunday."],"key":["Zovem se Adam.","Ne govorim dobro bosanski.","Gdje je autobuska stanica?","Htio / htjela bih vodu, molim.","Danas je nedjelja."]},{"t":"ex","title":"Part C – Fill in the present tense","items":["Mi ___ (biti) studenti.","Ona ___ (imati) dvije sestre.","Ti ___ (govoriti) engleski?","Oni ___ (raditi) u Sarajevu."],"key":["smo","ima","govoriš","rade"]},{"t":"ex","title":"Part D – Grammar","items":["Give the gender (m / f / n) of: grad, kuća, dijete, ulica, auto","Write the numbers 1–10 in Bosnian.","Make these plural: knjiga, prijatelj, selo"],"key":["m, f, n, f, m","jedan, dva, tri, četiri, pet, šest, sedam, osam, devet, deset","knjige, prijatelji, sela"]},{"t":"ex","title":"Part E – Reading. \"Zovem se Amir. Živim u Ilidži sa ženom i kćerkom. Radim u banci. Vikendom volim šetati pored rijeke Bosne.\" Answer in English","items":["Where does Amir work?","Who does he live with?","What does he like to do on weekends?"],"key":["In a bank.","His wife and daughter.","Walk by the river Bosna."]}]},{"id":"1","title":"How Bosnian Works","full":"Unit 1 – Gender · number · the seven cases","blocks":[{"t":"p","text":"English shows who does what to whom with word order: \"the dog bites the man\" and \"the man bites the dog\" use the same words. Bosnian does it with endings instead. Every noun, adjective and pronoun changes its ending depending on its job in the sentence – that job is called its case. There are seven cases, and this book teaches the five you need at A2 (accusative, genitive, locative, dative, instrumental) one at a time in Units 2–6. This unit gives you the map, plus the two cases you already use without noticing: nominative and vocative."},{"t":"objectives","items":["Tell the gender of a noun from its ending","Form regular plurals","Make adjectives agree with nouns","Address people correctly with the vocative","Recognise the seven cases and what each one does"]},{"t":"h2","text":"Start here – Komšije (Neighbours)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Adam","Dobar dan, komšija! Ja sam Adam, novi komšija."],["Mirsad","Merhaba, Adame! Ja sam Mirsad. Dobro došli!"],["Adam","Hvala. Ovo je moja žena Amina i naša djeca."],["Mirsad","Drago mi je. Amina, jeste li vi iz Sarajeva?"],["Amina","Jesam, a Adam je Amerikanac."],["Mirsad","Amerikanac! Dođite na kafu. Moja žena pravi najbolju kafu u Ilidži."]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 1N – Notice","items":["Find the two greetings. Which one is a Turkish loanword?","Adam says \"novi komšija\" but Mirsad says \"Adame\". What has changed on Adam's name, and why?","Which nouns end in -a? Are they all feminine? (Look at \"komšija\".)"],"key":["Merhaba (Turkish/Arabic origin); Dobar dan is Slavic.","Adam → Adame: the vocative -e, used when speaking directly to someone.","No – komšija ends in -a but refers to a man and is masculine (moj komšija)."]},{"t":"ex","title":"Exercise 1S – Say it again: change the words in the dialogue","items":["Say Adam's first line as Amina: \"Dobar dan, komšinice! Ja sam Amina, ___ komšinica.\"","Mirsad greets Amir instead of Adam: \"Merhaba, ___!\"","Adam introduces his brother instead of his wife: \"Ovo je moj ___ Emir.\"","Mirsad asks Adam (not Amina) if he is from Sarajevo: \"Adame, ___ li vi iz Sarajeva?\""],"key":["Dobar dan, komšinice! Ja sam Amina, nova komšinica.","Merhaba, Amire!","Ovo je moj brat Emir.","Adame, jeste li vi iz Sarajeva?"]},{"t":"h2","text":"The grammar behind it"},{"t":"h2","text":"The seven cases at a glance"},{"t":"table","header":["Case","Question it answers","Typical use","Example"],"rows":[["Nominative","ko? šta? (who? what?)","the subject; naming things","Kafa je topla. (The coffee is hot.)"],["Genitive","koga? čega? (of whom? of what?)","possession, \"of\", \"from\", quantities","šolja kafe (a cup of coffee)"],["Dative","kome? čemu? (to whom?)","the receiver; \"to\" a person","Dajem kafu ženi. (I give coffee to my wife.)"],["Accusative","koga? šta? (whom? what?)","the direct object; motion towards","Pijem kafu. (I drink coffee.)"],["Vocative","(calling someone)","addressing a person directly","Amire! Mama! Gospodine!"],["Instrumental","s kim? čim? (with whom? by what?)","\"with\"; means of doing something","sa kafom (with coffee)"],["Locative","o kome? gdje? (about whom? where?)","location; \"about\"","u kafi (in the coffee)"]]},{"t":"note","text":"Bosnian, Croatian and Serbian share this system almost entirely. Everything in this book also works in Zagreb and Belgrade with minor vocabulary differences."},{"t":"h2","text":"Gender: the key to every ending"},{"t":"p","text":"Every noun is masculine, feminine or neuter, and in most cases you can tell from the last letter of the dictionary (nominative) form."},{"t":"table","header":["Gender","Usually ends in","Examples","Watch out for"],"rows":[["Masculine","a consonant","grad, stan, brat, hljeb, muž, ključ","a few -a nouns for men: tata (dad), kolega, komšija, sudija – they take feminine endings but masculine adjectives; auto (car) is masculine despite -o"],["Feminine","-a","žena, kuća, kafa, gitara, ulica","some consonant nouns are feminine: noć, stvar, riječ, ljubav, sol, kost"],["Neuter","-o or -e","selo, pivo, mlijeko, more, dijete, ime","dijete (child) and ime (name) add -et-/-en- in other cases: djeteta, imena"]]},{"t":"h2","text":"Plurals (nominative)"},{"t":"p","text":"Feminine and neuter plurals are simple. Masculine plurals have several patterns, so they get their own table below."},{"t":"table","header":["Gender","Ending","Examples","Notes"],"rows":[["Feminine -a","-a → -e","žena → žene, kuća → kuće, ulica → ulice, pjesma → pjesme","no exceptions"],["Feminine consonant","+ -i","noć → noći, stvar → stvari, riječ → riječi, ljubav → ljubavi",""],["Neuter -o / -e","-o/-e → -a","selo → sela, pivo → piva, more → mora, ime → imena, dijete → djeca","ime, vrijeme add -en-: imena, vremena; dijete → djeca is a collective, treated like a feminine singular for endings"],["Masculine","+ -i (see below)","stan → stanovi, grad → gradovi, prijatelj → prijatelji","three questions – next table"]]},{"t":"h2","text":"Masculine plurals: three questions"},{"t":"p","text":"Every masculine plural ends in -i. To know what goes in front of it, ask three questions in order. That is the whole system for A2; the finer points are in the Appendix if you want them later."},{"t":"table","header":["Ask","If yes…","Examples"],"rows":[["1. Is it one of the five irregulars?","learn the word","brat → braća, čovjek → ljudi, dijete → djeca, oko → oči, uho → uši"],["2. Is the word long (2+ syllables)?","just add -i","prijatelj → prijatelji, telefon → telefoni, tramvaj → tramvaji, student → studenti"],["3. Is the word short (1 syllable)?","add -ovi (or -evi after a soft consonant: c č ć đ j lj nj š ž)","grad → gradovi, stan → stanovi, sin → sinovi | ključ → ključevi, muž → muževi, nož → noževi"]]},{"t":"note","text":"Two small adjustments you will meet constantly. (a) k, g, h turn into c, z, s before -i: dječak → dječaci, vojnik → vojnici, orah → orasi. (b) Words ending in -ac drop the a: Bosanac → Bosanci, stranac → stranci. Both happen in the \"long word\" group. A handful of short words take plain -i (dan → dani, zub → zubi, gost → gosti, konj → konji) – learn those as you meet them."},{"t":"note","text":"braća, djeca and gospoda (from gospodin) are collectives: they take FEMININE SINGULAR endings even though they mean many people – moja braća, vidim braću, sa braćom. Masculine nouns in -a (komšija, kolega, tata) take the feminine plural -e: komšije, kolege."},{"t":"h2","text":"Adjectives agree"},{"t":"p","text":"An adjective takes the gender and number of its noun: dobar dan, dobra kafa, dobro pivo; dobri ljudi, dobre žene, dobra djeca. Many masculine adjectives lose an -a- in the feminine and neuter: dobar → dobra, hladan → hladna, topao → topla, umoran → umorna."},{"t":"h2","text":"The vocative: calling someone"},{"t":"p","text":"When you speak directly to someone – greeting, calling, writing \"Dear…\" – the name takes the vocative. It is used constantly in daily life and in every sevdalinka."},{"t":"table","header":["Noun","Vocative","Rule"],"rows":[["Amir, brat, gospodin","Amire! brate! gospodine!","masculine consonant → -e"],["muž, prijatelj, Haris","mužu! prijatelju! Harise!","soft consonant (ž, š, č, ć, đ, j, lj, nj) → -u; -s names usually -e"],["Amira, mama, gospođa","Amira! mama! gospođo!","two-syllable -a names: unchanged; longer -a nouns → -o"],["Ajla, Lejla, Emina","Ajla! Lejla! Emina!","most female names: unchanged in Bosnian usage"],["dijete, sin","dijete! sine!","neuter unchanged; sin → sine is very common"],["Bog, drug, dragi","Bože moj! Dragi prijatelju!","set phrases"]]},{"t":"h2","text":"The words you will decline all book long"},{"t":"vocab","rows":[["grad, grada (m)","city, town"],["kafa (f)","coffee"],["stan, stana (m)","apartment"],["voda (f)","water"],["kuća (f)","house"],["hljeb, hljeba (m)","bread"],["selo (n)","village"],["mlijeko (n)","milk"],["ulica (f)","street"],["pivo (n)","beer"],["čovjek, čovjeka / ljudi (m)","man, person / people"],["auto (m; pl. auta)","car"],["žena (f)","woman, wife"],["ključ, ključa (m)","key"],["muž, muža (m)","husband"],["knjiga (f)","book"],["dijete, djeteta / djeca (n)","child / children"],["telefon (m)","phone"],["prijatelj / prijateljica (m/f)","friend (m / f)"],["posao, posla (m)","job, work"],["brat (m)","brother"],["dobar / dobra / dobro","good"],["sestra (f)","sister"],["velik / velika / veliko","big"],["sin, sina (m)","son"],["mali / mala / malo","small"],["kćerka (f)","daughter"],["nov / nova / novo","new"],["komšija / komšinica (m/f)","neighbour (m / f)"],["star / stara / staro","old"]]},{"t":"h3","text":"Words for talking · Home"},{"t":"vocab","rows":[["soba (f)","room"],["kuhinja (f)","kitchen"],["kupatilo (n)","bathroom"],["spavaća soba (f)","bedroom"],["dnevna soba (f)","living room"],["vrata (n, plural)","door"],["prozor (m)","window"],["sto, stola (m)","table"],["stolica (f)","chair"],["krevet (m)","bed"],["zid (m)","wall"],["pod (m)","floor"],["bašta (f)","garden"],["komšiluk (m)","neighbourhood"]]},{"t":"ex","title":"Exercise 1A – Give the gender (m / f / n)","items":["grad","kafa","pivo","ulica","ključ","more","noć","stan","ime","kćerka","komšija","dijete"],"key":["m","f","n","f","m","n","f","m","n","f","m (despite -a)","n"]},{"t":"ex","title":"Exercise 1B – Make the plural (for masculine nouns, say: irregular / long / short)","items":["stan","žena","selo","grad","ključ","dječak","prijateljica","ime","stvar","dijete","most","muž","dan","Bosanac","komšija","brat","čovjek","sat","nož","vojnik","otac","auto"],"key":["stanovi (short)","žene","sela","gradovi (short)","ključevi (short, soft → -evi)","dječaci (long, k → c)","prijateljice","imena","stvari","djeca (irregular)","mostovi (short)","muževi (short, soft → -evi)","dani (short, but plain -i – learn it)","Bosanci (long, -ac drops a, c)","komšije (-a noun → -e)","braća (irregular)","ljudi (irregular)","satovi (short)","noževi (short, soft → -evi)","vojnici (long, k → c)","očevi (otac: a drops, soft → -evi)","auta (borrowed -o noun, plural -a)"]},{"t":"ex","title":"Exercise 1C – Add the correct adjective ending","items":["dobr___ kafa","velik___ grad","mal___ selo","star___ kuća","nov___ auto","hladn___ pivo","dobr___ ljudi","lijep___ žene","umor___ djeca (umoran)","topl___ hljeb (topao)"],"key":["dobra","veliki (or velik)","malo","stara","novi (or nov)","hladno","dobri","lijepe","umorna","topli (or topao)"]},{"t":"ex","title":"Exercise 1D – Write the vocative","items":["Amir, dođi! →","Mama, gdje si? →","Gospodin, izvolite. →","Prijatelj, kako si? →","Sin, jedi! →","Gospođa, hvala. →","Brat, pomozi mi! →","Haris, čekaj! →"],"key":["Amire","Mama","Gospodine","Prijatelju","Sine","Gospođo","Brate","Harise"]},{"t":"ex","title":"Exercise 1E – Which case? Give the case of each word in brackets (N, G, D, A, V, I, L)","items":["Amire, gdje je ključ? (Amire / ključ)","Dajem knjigu bratu. (knjigu / bratu)","Pijem kafu sa mlijekom. (kafu / mlijekom)","Živim u Sarajevu blizu rijeke. (Sarajevu / rijeke)","Moja sestra voli muziku. (sestra / muziku)"],"key":["Amire = V, ključ = N","knjigu = A, bratu = D","kafu = A, mlijekom = I","Sarajevu = L, rijeke = G","sestra = N, muziku = A"]},{"t":"ex","title":"Exercise 1F – Present tense: conjugate for every person (ja, ti, on/ona, mi, vi, oni)","items":["imati (to have)","raditi (to work)","pisati (to write)","kupovati (to buy)","ići (to go)","moći (can)","biti (to be) – short forms","htjeti (to want) – long forms"],"key":["imam, imaš, ima, imamo, imate, imaju","radim, radiš, radi, radimo, radite, rade","pišem, pišeš, piše, pišemo, pišete, pišu","kupujem, kupuješ, kupuje, kupujemo, kupujete, kupuju","idem, ideš, ide, idemo, idete, idu","mogu, možeš, može, možemo, možete, mogu","sam, si, je, smo, ste, su","hoću, hoćeš, hoće, hoćemo, hoćete, hoće"]},{"t":"ex","title":"Exercise 1G – Match each noun to its plural","items":["Match: 1. grad   2. žena   3. dijete   4. ključ   5. brat   6. ime   7. komšija   8. čovjek"],"key":["grad–d, žena–g, dijete–f, ključ–b, brat–h, ime–a, komšija–e, čovjek–c"],"intro":"Choose from: a. imena   b. ključevi   c. ljudi   d. gradovi   e. komšije   f. djeca   g. žene   h. braća"},{"t":"ex","title":"Exercise 1H – Complete the dialogue: Adam meets his new neighbour Emina","items":["Adam: Dobar dan! Ja sam Adam, ___ komšija. (new)","Emina: Dobar dan, ___! Ja sam Emina. (Adam – vocative)","Adam: Ovo je moja ___ Amina. (wife)","Emina: Drago mi je. Imate li ___? (children)","Adam: Imamo dva ___ i jednu ___. (sons / daughter)","Emina: Divno! Dođite na ___. (coffee)"],"key":["novi","Adame","žena","djecu / djece – accept djeca at this stage","sina, kćerku","kafu"]},{"t":"culture","title":"One language, three names","text":"Bosnian, Croatian and Serbian are mutually intelligible varieties of one language system, with the same seven cases and the same verb forms. Bosnian is written in the Latin alphabet, keeps the ijekavian pronunciation (mlijeko, lijep, djeca) and has more Turkish and Arabic loanwords than its neighbours – kafa, čaršija, komšija, merhaba, bujrum. Learn Bosnian and you will be understood from Zagreb to Belgrade."},{"t":"h2","text":"Mini reading"},{"t":"p","text":"Zovem se Adam. Ja sam Amerikanac, ali živim u Bosni. Moja žena je Bosanka. Zove se Amina. Imamo troje djece: dva sina i jednu kćerku. Naš stan je u Ilidži, blizu Sarajeva. Ja sam muzičar i student. Moja žena je učiteljica. Naše komšije su dobri ljudi. Svako jutro pijemo kafu zajedno. Amina kaže: \"Adame, kafa je gotova!\"","italic":true},{"t":"ex","title":"Exercise 1I – Answer","items":["What nationality are Adam and Amina?","How many children do they have, and what are they?","What are Adam's and Amina's jobs?","Find one vocative, one locative and one genitive in the text."],"key":["Adam is American, Amina is Bosnian.","Three: two sons and a daughter.","Adam is a musician and student; Amina is a teacher.","Vocative: Adame; locative: u Bosni / u Ilidži; genitive: djece / Sarajeva."]},{"t":"ex","title":"Extra practice – Mixed review","items":["Give the gender and plural of: most (bridge), pjesma (song), jaje (egg), tramvaj, riječ (word)","Fix the adjective: \"dobar kafa\", \"velika grad\", \"malo kuća\", \"stari žene\"","Write the vocative: \"Emir, čekaj!\", \"Lejla, dođi!\", \"Tata, gladan sam!\" (tata → tata)","Which case is each word in brackets? \"Pišem pismo prijatelju u Ameriku.\" (pismo / prijatelju / Ameriku)","Translate: \"The children are tired.\" (tired = umoran)","Translate: \"My neighbour is a good man.\"","Translate: \"Good morning, Mr. Hadžić!\" (gospodin Hadžić → vocative of gospodin only)","Sort into m / f / n: mlijeko, hljeb, pivo, voda, čaj, sok (juice), meso (meat), riba (fish)"],"key":["most m → mostovi; pjesma f → pjesme; jaje n → jaja; tramvaj m → tramvaji; riječ f → riječi","dobra kafa, veliki grad, mala kuća, stare žene","Emire, čekaj! Lejla, dođi! Tata, gladan sam!","pismo = A, prijatelju = D, Ameriku = A","Djeca su umorna.","Moj komšija je dobar čovjek.","Dobro jutro, gospodine Hadžić!","m: hljeb, čaj, sok; f: voda, riba; n: mlijeko, pivo, meso"]},{"t":"ex","title":"Exercise 1J – About you","items":["About you. Write four sentences: your name, where you live (Živim u…), your job (Ja sam…), and one sentence about your family (Imam…). Use the present tense only."],"key":["Free writing. Model: Zovem se Sarah. Živim u Londonu. Ja sam učiteljica. Imam brata i sestru."]},{"t":"mistakes","items":["Guessing gender from meaning: \"kafa\" is feminine because it ends in -a, not because of what it is. Always check the ending.","Treating \"djeca\" as plural in the endings. It behaves like a feminine singular noun: djeca su (plural verb) but moja djeca, vidim djecu.","Forgetting the vocative for names: \"Amir, dođi!\" is understood but sounds foreign; say \"Amire, dođi!\"","Short masculine plurals: \"gradi\", \"stani\", \"ključi\" are wrong – one-syllable nouns usually need -ovi/-evi: gradovi, stanovi, ključevi."]},{"t":"cando","items":["say whether grad, kuća and selo are m, f or n","make five nouns plural","say \"good coffee\", \"good beer\" and \"good people\" with the right endings","greet a man called Amir and a woman called Amira correctly","name the seven cases"]}]},{"id":"2","title":"The Accusative","full":"Unit 2 – Direct objects · where to · for whom","blocks":[{"t":"p","text":"If you learn one thing from this book, learn this: whenever a noun is the thing being acted on (I see X, I want X, I have X, I drink X), it goes into the accusative."},{"t":"objectives","items":["Put the direct object of a verb into the accusative","Use u / na + accusative for movement towards a place","Say what you drink, eat, buy, see and love"]},{"t":"h2","text":"Start here – U pekari (At the bakery)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Adam","Dobar dan. Trebam hljeb i dvije kifle."],["Prodavačica","Izvolite. Želite li još nešto?"],["Adam","Imate li pitu sa sirom?"],["Prodavačica","Imamo sirnicu i zeljanicu. Koju želite?"],["Adam","Jednu sirnicu, molim. I jednu kafu za ženu."],["Prodavačica","Kafu ne prodajemo, ali kafana je preko puta."]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 2N – Notice","items":["Hljeb does not change after \"trebam\", but kifla becomes kifle and pita becomes pitu. Why the difference?","Find every noun that follows \"želite / imate / prodajemo\". Which case are they all in?","What is the ending on \"kafa\" after \"jednu\"? And on \"žena\" after \"za\"?"],"key":["Hljeb is masculine (inanimate) – no change in the accusative; kifla and pita are feminine -a nouns → -u (and plural -e).","pitu, sirnicu, zeljanicu, kafu, kifle – all accusative (direct objects).","kafu (-a → -u); ženu (za + accusative)."]},{"t":"ex","title":"Exercise 2S – Say it again: change the words in the dialogue","items":["Adam asks for milk and cheese instead: \"Trebam ___ i ___.\"","He wants pie with meat (meso): \"Imate li pitu sa ___?\" (careful – this one is instrumental, Unit 6!)","He orders two burek instead of one sirnica: \"Dva ___, molim.\"","The coffee is for his daughter: \"I jednu kafu za ___.\"","The seller sells tea, not coffee: \"___ ne prodajemo.\""],"key":["Trebam mlijeko i sir.","Imate li pitu sa mesom?","Dva bureka, molim.","I jednu kafu za kćerku.","Čaj ne prodajemo."]},{"t":"h2","text":"The grammar behind it"},{"t":"img","src":"diag_accusative"},{"t":"p","text":"The thing the verb acts on changes its ending: kafa → kafu · žena → ženu · brat → brata"},{"t":"h2","text":"The rules"},{"t":"table","header":["Noun type","Change","Example (nominative → accusative)"],"rows":[["Feminine ending in -a","-a → -u","kafa → kafu, žena → ženu, gitara → gitaru"],["Masculine, not alive","no change","grad → grad, hljeb → hljeb, auto → auto"],["Masculine, alive","add -a","brat → brata, prijatelj → prijatelja, pas → psa"],["Neuter","no change","dijete → dijete, mlijeko → mlijeko, pivo → pivo"],["Feminine ending in consonant","no change","noć → noć, stvar → stvar, riječ → riječ"]]},{"t":"table","header":["Plural","Change","Example"],"rows":[["Masculine","-i → -e","gradovi → gradove, prijatelji → prijatelje"],["Feminine","no change","žene → žene, knjige → knjige"],["Neuter","no change","sela → sela, djeca → djecu (irregular!)"]]},{"t":"note","text":"Adjectives and possessives change too: moja žena → moju ženu; dobar prijatelj → dobrog prijatelja; nova gitara → novu gitaru; naš grad → naš grad."},{"t":"note","text":"svoj – \"my own / your own / his own\". When the owner is the subject of the sentence, Bosnian prefers svoj to moj/tvoj/njegov: Volim svoju ženu (I love my wife), Ona voli svog sina (she loves her own son). Moju ženu is also correct and common in speech; the answer key accepts both. Full table in Appendix C."},{"t":"h2","text":"Where else the accusative appears"},{"t":"p","text":"1.  Motion towards a place, after u or na: Idem u grad. Idem na koncert. Vozim djecu u školu."},{"t":"p","text":"2.  Time expressions: svaki dan, cijelu sedmicu, svaku subotu, ovu godinu."},{"t":"p","text":"3.  After za (for): kafa za ženu, poklon za djecu, gitara za mene."},{"t":"h2","text":"Vocabulary"},{"t":"vocab","rows":[["hljeb, hljeba (m)","bread"],["komšija (m)","neighbour"],["mlijeko (n)","milk"],["novčanik (m)","wallet"],["kafa (f)","coffee"],["torba (f)","bag"],["čaj, čaja (m)","tea"],["auto (m)","car"],["pita (f)","pie (burek etc.)"],["ključ, ključa (m)","key"],["gitara (f)","guitar"],["vidjeti, vidim","to see"],["pjesma (f)","song"],["čuti, čujem","to hear"],["knjiga (f)","book"],["voljeti, volim","to love / like"],["pismo (n)","letter"],["trebati, trebam","to need"],["poruka (f)","message"],["tražiti, tražim","to look for"],["žena (f)","wife / woman"],["kupovati, kupujem","to buy"],["muž, muža (m)","husband"],["svirati, sviram","to play (an instrument)"],["kćerka (f)","daughter"],["slušati, slušam","to listen to"],["sin, sina (m)","son"],["čekati, čekam","to wait for"],["djeca (collective, takes f. sg. endings)","children"],["zvati, zovem","to call"],["kifla (f)","bread roll"],["sirnica (f)","cheese pie"],["zeljanica (f)","spinach pie"],["pekara (f)","bakery"]]},{"t":"h3","text":"Words for talking · Food and drink"},{"t":"vocab","rows":[["doručak, doručka (m)","breakfast"],["ručak, ručka (m)","lunch"],["večera (f)","dinner"],["voće (n)","fruit"],["povrće (n)","vegetables"],["meso (n)","meat"],["riba (f)","fish"],["jaje (n; pl. jaja)","egg"],["sir, sira (m)","cheese"],["šećer (m)","sugar"],["so, soli (f)","salt"],["sok (m)","juice"],["vino (n)","wine"],["burek (m)","meat pie"],["ćevapi (m, plural)","grilled meat rolls"],["kolač (m)","cake"],["sladoled (m)","ice cream"],["jesti, jedem","to eat"],["piti, pijem","to drink"]]},{"t":"ex","title":"Exercise 2A – Put the noun in the accusative","items":["Pijem ___ (kafa) svako jutro.","Sviram ___ (gitara) navečer.","Volim ___ (moja žena).","Tražim ___ (ključ) od auta.","Vidim ___ (komšija) na ulici.","Kupujem ___ (hljeb) i ___ (mlijeko).","Slušam ___ (pjesma) na radiju.","Čekam ___ (autobus) za Sarajevo.","Zovem ___ (brat) svake nedjelje.","Vozim ___ (djeca) u školu.","Čitam ___ (knjiga) o Bosni.","Pišem ___ (poruka) za ___ (kćerka)."],"key":["kafu","gitaru","moju ženu","ključ","komšiju","hljeb, mlijeko","pjesmu","autobus","brata","djecu","knjigu","poruku, kćerku"]},{"t":"ex","title":"Exercise 2B – Translate into Bosnian","items":["I drink coffee every day.","I love my wife and my children.","I am looking for my wallet.","I need bread, milk and eggs. (egg = jaje, plural jaja)","I see the mosque from the window. (mosque = džamija, window = prozor, from = sa + genitive → sa prozora)","We are waiting for the tram. (tram = tramvaj)","She is playing the piano. (piano = klavir)","I am going to the concert on Saturday. (Saturday = subota → u subotu)","I am calling my friend.","Every Sunday I play the guitar."],"key":["Pijem kafu svaki dan.","Volim svoju ženu i svoju djecu. (moju / moju also accepted)","Tražim svoj novčanik.","Trebam hljeb, mlijeko i jaja.","Vidim džamiju sa prozora.","Čekamo tramvaj.","Ona svira klavir.","Idem na koncert u subotu.","Zovem prijatelja.","Svake nedjelje sviram gitaru."]},{"t":"ex","title":"Exercise 2C – Find and fix the mistake","items":["Želim voda, molim.","Vidim moja sestra.","Volim Sarajevo i Ilidža.","Imam dobar prijatelj u Sarajevu.","Sviram gitara svaki dan.","Idem u grad i kupujem knjiga."],"key":["Želim vodu, molim.","Vidim svoju/moju sestru.","Volim Sarajevo i Ilidžu.","Imam dobrog prijatelja u Sarajevu.","Sviram gitaru svaki dan.","Idem u grad i kupujem knjigu."]},{"t":"ex","title":"Exercise 2D – Match the verb to the most likely object, then write the object in the accusative","items":["Match: 1. pijem   2. sviram   3. čitam   4. čekam   5. zovem   6. jedem"],"key":["pijem–d kafu, sviram–e gitaru, čitam–a knjigu, čekam–f autobus, zovem–b brata, jedem–c pitu"],"intro":"Choose from: a. knjiga   b. brat   c. pita   d. kafa   e. gitara   f. autobus"},{"t":"ex","title":"Exercise 2E – Complete the dialogue at the market stall","items":["Prodavač: Dobar dan! Šta želite? — Amina: Trebam ___ i ___. (apples / cheese)","Prodavač: Imamo domaći sir. Želite li i ___? (eggs)","Amina: Da, deset jaja. I jednu ___ za djecu. (chocolate = čokolada)","Prodavač: Izvolite. Imate li ___? (a bag = kesa)","Amina: Imam ___. Hvala! (my own bag = svoja torba)"],"key":["jabuke, sir","jaja","čokoladu","kesu","svoju torbu"]},{"t":"note","text":"You can already talk about the past. You will learn the past tense properly in Unit 7, but two forms are worth using from today. \"I was\" = bio sam (man) / bila sam (woman): Bio sam u gradu. Bila sam kod komšije. And \"I would like\" = htio bih / htjela bih: Htio bih kafu. Htjela bih pitu. Both take the accusative you are learning now.","label":"Preview"},{"t":"culture","title":"Kafa, not coffee","text":"Bosnian coffee is served in a džezva (long-handled pot) with a fildžan (small cup) and a sugar cube you dip, not stir. \"Idemo na kafu\" rarely means a quick espresso – it means an hour of conversation. Refusing coffee at someone's house is close to refusing friendship."},{"t":"h2","text":"Mini reading"},{"t":"p","text":"Svako jutro pijem kafu i čitam vijesti. Onda vozim djecu u školu. Poslije toga idem na fakultet. Popodne sviram gitaru i pišem pjesme. Navečer gledam film sa ženom ili slušam muziku. Vikendom zovem brata u Americi.","italic":true},{"t":"ex","title":"Exercise 2F – Answer in English","items":["What does he do every morning?","Where does he go after dropping the kids off?","What does he do in the afternoon?","List every accusative noun in the text (there are 10, counting the two after \"u/na\" for motion)."],"key":["Drinks coffee and reads the news.","To the university.","Plays guitar and writes songs.","kafu, vijesti, djecu, školu, fakultet, gitaru, pjesme, film, muziku, brata"]},{"t":"ex","title":"Extra practice – Mixed review","items":["Volim ___ (Sarajevo), ___ (Mostar) i ___ (Bosna).","Svaki dan pijem ___ (čaj) i jedem ___ (jabuka).","Tražim ___ (moj muž) i ___ (moja kćerka).","Idemo na ___ (pijaca) i u ___ (pekara).","Translate: \"I hear music.\" (music = muzika)","Translate: \"She loves her son and her daughter.\" (her own = svog / svoju)","Translate: \"We are waiting for the doctor.\" (doctor = ljekar)","Translate: \"Every Sunday I call my mother.\"","Fix: \"Gledam film i slušam muzika.\"","Fix: \"Poznajem tvoj brat.\" (poznavati = to know a person)"],"key":["Sarajevo, Mostar, Bosnu","čaj, jabuku","svog muža, svoju kćerku","pijacu, pekaru","Čujem muziku.","Ona voli svog sina i svoju kćerku.","Čekamo ljekara.","Svake nedjelje zovem majku / mamu.","Gledam film i slušam muziku.","Poznajem tvog brata."]},{"t":"ex","title":"From earlier units – Unit 1","items":["Gender of: noć, auto, ime","Plural of: ključ, dijete, prijatelj","Vocative: \"Emir, dođi!\"","Fix the adjective: \"dobar žena\"","Which case is \"kafa\" in \"Kafa je topla\"?"],"key":["f, m, n","ključevi, djeca, prijatelji","Emire, dođi!","dobra žena","Nominative"]},{"t":"ex","title":"Exercise 2G – About you","items":["About you. What do you eat and drink every day? Write five sentences with jedem / pijem / kupujem and an accusative object. Then one sentence with \"Volim…\" about a person."],"key":["Free writing. Check every object: -a → -u, living masculine + -a. Model: Ujutro pijem čaj. Jedem hljeb i sir. Kupujem voće svaki dan. Volim svog brata."]},{"t":"mistakes","items":["Leaving feminine objects in the nominative: \"Pijem kafa\" → Pijem kafu.","Forgetting that living masculine nouns add -a: \"Vidim brat\" → Vidim brata.","Changing masculine things that should not change: \"Kupujem hljeba\" is genitive (some bread) – for a whole loaf say Kupujem hljeb."]},{"t":"cando","items":["say \"I drink coffee, I eat pie, I buy bread and milk\"","say \"I see my brother / my sister / my children\"","say where you are going with u and na","correct the sentence \"Želim voda\""]}]},{"id":"3","title":"The Genitive","full":"Unit 3 – Of · from · without · how much","blocks":[{"t":"p","text":"Almost every learner says \"auto moja sestra\" at first. The genitive is the \"of\" case – possession, origin, quantities, and a long list of prepositions. It is the most frequent case in Bosnian after the nominative, so this unit is heavy."},{"t":"objectives","items":["Express possession and \"of\" with the genitive","Say where you are from with iz","Use the right noun form after numbers and quantity words","Use the prepositions kod, pored, blizu, bez, poslije, prije"]},{"t":"h2","text":"Start here – Odakle si? (Where are you from?)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Emir","Adame, odakle si ti?"],["Adam","Ja sam iz Amerike, iz Floride. A ti?"],["Emir","Ja sam iz Zenice, ali živim u Sarajevu već deset godina."],["Adam","Imaš li porodicu ovdje?"],["Emir","Imam brata i dvije sestre. Brat živi blizu centra, a sestre su još u Zenici."],["Adam","Mi živimo pored parka, kod stanice. Dođi poslije posla na kafu!"]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 3N – Notice","items":["List every word after \"iz\". What ending do they all share (m/n vs f)?","\"Imam brata i dvije sestre\" – why brata (Unit 2) but sestre (this unit)?","Find the three place prepositions and the case they take."],"key":["iz Amerike, iz Floride, iz Zenice – genitive: -e for feminine -a nouns (masc./neut. would be -a: iz Mostara).","brata – accusative singular of an animate masculine (one brother); sestre – genitive singular after dvije (2–4 take genitive singular).","blizu, pored, kod – all + genitive."]},{"t":"ex","title":"Exercise 3S – Say it again: change the words in the dialogue","items":["Adam is from Chicago (Čikago): \"Ja sam iz ___.\"","Emir is from Tuzla and has lived in Mostar for five years: \"Ja sam iz ___, ali živim u ___ već pet ___.\"","He has two brothers and one sister: \"Imam ___ ___ i ___ ___.\"","They live next to the school, near the river: \"Mi živimo pored ___, blizu ___.\""],"key":["Ja sam iz Čikaga.","Ja sam iz Tuzle, ali živim u Mostaru već pet godina.","Imam dva brata i jednu sestru.","Mi živimo pored škole, blizu rijeke."]},{"t":"h2","text":"The grammar behind it"},{"t":"h2","text":"The endings"},{"t":"table","header":["Noun type","Singular","Plural","Example"],"rows":[["Masculine","-a","-a (often lengthened: -ova/-eva)","grad → grada → gradova; brat → brata → braće (irreg.)"],["Feminine -a","-e","-a","žena → žene → žena; knjiga → knjige → knjiga"],["Neuter","-a","-a","selo → sela → sela; dijete → djeteta → djece"],["Feminine consonant","-i","-i","stvar → stvari → stvari; noć → noći → noći"]]},{"t":"note","text":"Adjectives: masculine/neuter -og (dobrog, novog), feminine -e (dobre, nove). Possessives: moj → mog, moja → moje, naš → našeg, naša → našeg / naše."},{"t":"note","text":"Genitive plural – two things to know. (a) Nouns whose stem ends in two consonants insert an -a-: pjesma → pjesama, karta → karata, sestra → sestara, djevojka → djevojaka. (b) A few short masculine nouns take -i instead of -a: sat → sati (pet sati), mjesec → mjeseci, ljudi → ljudi. Godina, kafa and most feminine nouns are regular: pet godina, pet kafa."},{"t":"h2","text":"Six jobs of the genitive"},{"t":"p","text":"1.  Possession (\"of\"): auto moje sestre, kuća mog brata, centar grada, vrata kuće."},{"t":"p","text":"2.  Origin and separation with iz (from, out of), od (from a person / made of), sa (down from, off): Ja sam iz Amerike. Poklon od žene. Silazim sa autobusa."},{"t":"p","text":"3.  Prepositions of place: kod (at someone's), pored (next to), blizu (near), iza (behind), ispred (in front of), između (between), preko puta (across from). Živim blizu rijeke. Sjedim pored žene. Kod komšije sam."},{"t":"p","text":"4.  Quantities: numbers 2, 3, 4 take genitive SINGULAR (dvije kafe, tri sina, četiri godine). Numbers 5 and up, and words like mnogo, malo, nekoliko, koliko, take genitive PLURAL (pet godina, mnogo ljudi, malo vremena, koliko djece)."},{"t":"p","text":"5.  Negation of \"to have\": Imam vremena → Nemam vremena. Nema hljeba. Nema problema."},{"t":"p","text":"6.  Time: prije (before), poslije (after), za vrijeme (during): prije ručka, poslije koncerta, za vrijeme rata."},{"t":"note","text":"dva or dvije? The number 2 agrees with the noun: dva for masculine and neuter (dva brata, dva sela), dvije for feminine (dvije sestre, dvije kafe). Tri and četiri have one form. Jedan / jedna / jedno behaves like an adjective and takes the noun in the ordinary singular: jedan sin, jedna kćerka."},{"t":"h2","text":"Vocabulary"},{"t":"vocab","rows":[["kuća (f)","house"],["novac, novca (m)","money"],["stan, stana (m)","apartment"],["problem (m)","problem"],["rijeka (f)","river"],["poklon (m)","gift"],["planina (f)","mountain"],["ručak, ručka (m)","lunch"],["centar, centra (m)","centre"],["večera (f)","dinner"],["fakultet (m)","faculty / university"],["doručak, doručka (m)","breakfast"],["posao, posla (m)","job, work"],["sastanak, sastanka (m)","meeting"],["vrijeme, vremena (n)","time / weather"],["mnogo","a lot of"],["godina (f)","year"],["malo","a little / few"],["sedmica (f)","week"],["nekoliko","several"],["ljudi (m, plural)","people"],["koliko","how much / many"],["porodica (f)","family"],["dosta","enough / quite a lot"],["roditelji (m, plural)","parents"],["stanica (f)","station, stop"],["park (m)","park"],["šećer (m)","sugar"]]},{"t":"h3","text":"Words for talking · Numbers, money and quantities"},{"t":"vocab","rows":[["marka (f; gen. pl. maraka)","mark (BAM, the currency)"],["fening (m)","fening (1/100 mark)"],["cijena (f)","price"],["račun (m)","bill, receipt"],["kusur (m)","change (money)"],["pola","half"],["četvrt (f)","quarter"],["komad, komada (m)","piece"],["šolja (f)","cup"],["čaša (f)","glass"],["flaša (f)","bottle"],["kilo (n; gen. kila)","kilo"],["litar, litra (m)","litre"],["puno","a lot, full"],["previše","too much"],["koštati, košta","to cost"],["platiti, platim","to pay"]]},{"t":"ex","title":"Exercise 3A – Put the noun in the genitive","items":["To je gitara ___ (moj sin).","Ja sam iz ___ (Florida).","Živim blizu ___ (Sarajevo).","Idem kod ___ (komšija) na kafu.","Nemam ___ (vrijeme) danas.","Poslije ___ (ručak) sviram gitaru.","Kuća ___ (moja žena) je u Ilidži.","Sjedim pored ___ (rijeka).","Ovo je poklon od ___ (moj brat).","Centar ___ (grad) je lijep.","Silazim sa ___ (tramvaj).","Prije ___ (koncert) pijemo kafu."],"key":["mog sina","Floride","Sarajeva","komšije","vremena","ručka","moje žene","rijeke","mog brata","grada","tramvaja","koncerta"]},{"t":"ex","title":"Exercise 3B – Numbers and quantities: choose the right form","items":["Imam ___ djece. (troje / tri / trojica)","Imam dva ___ (sin) i jednu ___ (kćerka).","Živim ovdje tri ___ (godina).","Živim ovdje pet ___ (godina).","Pijem dvije ___ (kafa) dnevno.","Ima mnogo ___ (ljudi) na ulici.","Imam malo ___ (novac).","Koliko ___ (dijete → djeca) imate?","Čekam već nekoliko ___ (sat).","Sarajevo ima oko četiri stotine hiljada ___ (stanovnik – inhabitant)."],"key":["troje (djeca is a collective noun; use the collective number troje)","sina, kćerku (accusative after jednu – jedan/jedna + ordinary singular)","godine","godina","kafe","ljudi","novca","djece","sati","stanovnika"]},{"t":"ex","title":"Exercise 3C – Translate into Bosnian","items":["This is my wife's car.","I am from America, but my wife is from Bosnia.","I live near the university.","I don't have time today.","After lunch we are going to the centre of Sarajevo. (going = idemo)","I have three children and two guitars.","There is no bread. (use nema)","My father's house is big. (father = otac → oca)","I have been here for two years.","I am sitting next to my daughter."],"key":["Ovo je auto moje žene.","Ja sam iz Amerike, ali moja žena je iz Bosne.","Živim blizu fakulteta.","Nemam vremena danas.","Poslije ručka idemo u centar Sarajeva.","Imam troje djece i dvije gitare.","Nema hljeba.","Kuća mog oca je velika.","Ovdje sam (već) dvije godine.","Sjedim pored (svoje) kćerke."]},{"t":"ex","title":"Exercise 3D – Match the preposition to the phrase that completes it","items":["Match: 1. iz   2. kod   3. bez   4. poslije   5. pored   6. od"],"key":["iz–b, kod–f, bez–a, poslije–c, pored–e, od–d"],"intro":"Choose from: a. šećera (no sugar)   b. Amerike (from America)   c. ručka (after lunch)   d. brata (a gift from my brother)   e. rijeke (next to the river)   f. bake (at grandma's)"},{"t":"ex","title":"Exercise 3E – Complete the dialogue: paying at the café","items":["Adam: Koliko košta šolja ___? (coffee)","Konobar: Dvije ___. (marks)","Adam: A čaša ___? (juice = sok)","Konobar: Tri marke. Ukupno pet ___. (marks)","Adam: Izvolite deset. — Konobar: Hvala, pet maraka ___. (change = kusur; \"your change\" = kusura → say: Izvolite kusur.)"],"key":["kafe","marke","soka","maraka","Izvolite kusur. (or: pet maraka kusura)"]},{"t":"note","text":"Two verbs for one action. You will notice pairs like piti / popiti, kupovati / kupiti in the readings from now on. Bosnian has two versions of most verbs: one for the ongoing or repeated action (pijem – I drink, I am drinking), one for the completed action (popio sam – I drank it up). Unit 9 explains the system; for now, just notice which one the text uses and why.","label":"Preview"},{"t":"culture","title":"Komšiluk","text":"Komšija (neighbour) comes from Turkish, like hundreds of everyday Bosnian words: čaršija, pekara, ćevap, jastuk, kapija. Komšiluk – the community of neighbours – is a value in its own right; the saying goes \"Prvo komšija, pa Bog\" (first the neighbour, then God)."},{"t":"h2","text":"Mini reading"},{"t":"p","text":"Moja porodica živi u Ilidži, blizu centra. Naš stan je pored parka. Iz prozora vidim planinu Igman. Nemam mnogo slobodnog vremena, jer imam troje djece i studiram na fakultetu. Poslije predavanja idem kod prijatelja na kafu. Bez kafe ne mogu raditi.","italic":true},{"t":"ex","title":"Exercise 3F – Answer in English","items":["Where is the apartment?","What can he see from the window?","Why doesn't he have much free time?","What does he do after lectures?","List every genitive noun in the text (there are 8)."],"key":["In Ilidža, near the centre, next to a park.","Mount Igman.","Three children and studying at university.","Goes to a friend's for coffee.","centra, parka, prozora, vremena, djece, predavanja, prijatelja, kafe"]},{"t":"ex","title":"Extra practice – Mixed review","items":["Ovo je kuća ___ (naš komšija).","Nemam ___ (novac) ni ___ (vrijeme).","Imam dvadeset ___ (godina) – koliko ___ (godina) ti imaš?","Sjedimo ispred ___ (kuća) i pijemo kafu bez ___ (šećer – sugar).","Translate: \"a cup of coffee, a glass of water, a piece of pie\" (šolja, čaša, komad)","Translate: \"There are a lot of tourists in the centre of the city.\"","Translate: \"I live two kilometres from the station.\" (kilometar; from = od)","Translate: \"Before dinner I read; after dinner I watch TV.\" (TV = televizija → gledam televiziju)","Fix: \"Imam tri sinova.\"","Fix: \"Ona je iz Mostar.\""],"key":["našeg komšije","novca, vremena","godina, godina","kuće, šećera","šolja kafe, čaša vode, komad pite","Ima mnogo turista u centru grada.","Živim dva kilometra od stanice.","Prije večere čitam; poslije večere gledam televiziju.","Imam tri sina.","Ona je iz Mostara."]},{"t":"ex","title":"From earlier units – Units 1–2","items":["Plural of: grad, kuća, dijete","Accusative: Vidim ___ (sestra) i ___ (brat).","Vocative: \"Amira, dođi!\"","Fix: \"Volim Bosna.\"","Which case is \"ženu\" in \"kafa za ženu\"?"],"key":["gradovi, kuće, djeca","sestru, brata","Amira, dođi! (unchanged)","Volim Bosnu.","Accusative (after za)"]},{"t":"ex","title":"Exercise 3G – About you","items":["About you. Write five sentences: where you are from (Ja sam iz…), how many brothers/sisters/children you have (Imam…), how long you have lived in your town (Živim ovdje … godina), what you don't have time for (Nemam vremena za…), and whose house you like to visit (Idem kod…)."],"key":["Free writing. Check: iz + genitive, 2–4 + genitive singular, 5+ + genitive plural, kod + genitive."]},{"t":"mistakes","items":["Using the nominative for possession: \"auto moja sestra\" → auto moje sestre.","Using the wrong number rule: \"pet godine\" → pet godina (5+ takes genitive plural); \"dvije godina\" → dvije godine (2–4 take genitive singular).","Saying \"iz Sarajevo\" – every preposition changes the noun: iz Sarajeva, iz Amerike, iz Bosne."]},{"t":"cando","items":["say \"my wife's car\", \"the centre of the city\"","say where you and your family are from","count coffees, years and children correctly","say \"I don't have time / money\""]}]},{"id":"4","title":"The Locative","full":"Unit 4 – Where vs. where to","blocks":[{"t":"p","text":"Most learners say \"u gradu\" correctly and then write \"Živim u Sarajevo\" a line later. The rule is simple and it is the same two prepositions each time: u (in) and na (on / at)."},{"t":"objectives","items":["Say where something is with u / na + locative","Tell the difference between location (locative) and movement (accusative)","Choose between u and na","Talk \"about\" something with o + locative"]},{"t":"h2","text":"Start here – Gdje si? (Where are you?)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Amina","Adame, gdje si? Već je sedam."],["Adam","Još sam na fakultetu. Imam predavanje o historiji Bosne."],["Amina","A djeca? Jesu li u školi?"],["Adam","Ne, oni su kod bake u Hrasnici. Idem po njih poslije."],["Amina","Dobro. Ja sam na pijaci, kupujem povrće za večeru."],["Adam","Kupi i kafu! Nema kafe u kući."]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 4N – Notice","items":["Find \"na fakultetu\" and \"u školi\". Which question do they answer – gdje or kuda?","Why is it \"kod bake u Hrasnici\" and not \"u Hrasnicu\"?","Amina is \"na pijaci\". Why na and not u?"],"key":["gdje – no movement, so locative.","Living/being somewhere = location = locative (Hrasnici). \"u Hrasnicu\" would mean going there.","An open market is treated as an open space/event – one of the na-words."]},{"t":"ex","title":"Exercise 4S – Say it again: change the words in the dialogue","items":["Adam is still at work (posao): \"Još sam na ___.\"","The lecture is about music: \"Imam predavanje o ___.\"","The children are at their aunt's (tetka) in Ilidža: \"Oni su kod ___ u ___.\"","Amina is in the shop (prodavnica), buying fruit for breakfast: \"Ja sam u ___, kupujem ___ za ___.\""],"key":["Još sam na poslu.","Imam predavanje o muzici.","Oni su kod tetke u Ilidži.","Ja sam u prodavnici, kupujem voće za doručak."]},{"t":"h2","text":"The grammar behind it"},{"t":"img","src":"diag_locative"},{"t":"p","text":"Same two prepositions, u and na. Location keeps the locative ending; movement takes the accusative."},{"t":"table","header":["Question","Case","Example"],"rows":[["Gdje? (where, no movement)","LOCATIVE","Živim u Sarajevu. Radim na fakultetu. Sjedim u autu."],["Kuda / Gdje? (where to, movement)","ACCUSATIVE","Idem u Sarajevo. Idem na fakultet. Ulazim u auto."]]},{"t":"h2","text":"Locative endings"},{"t":"table","header":["Noun type","Singular","Plural","Example"],"rows":[["Masculine","-u","-ima","grad → u gradu → u gradovima"],["Neuter","-u","-ima","selo → u selu → u selima"],["Feminine -a","-i","-ama","kuća → u kući → u kućama"],["Feminine consonant","-i","-ima","noć → u noći → u noćima"]]},{"t":"note","text":"Sound change in feminine nouns: k → c, g → z, h → s before -i. Amerika → u Americi, banka → u banci, knjiga → u knjizi. Ilidža does not change (u Ilidži is just -a → -i). Most personal names skip the change: Anka → Anki."},{"t":"h2","text":"u or na?"},{"t":"p","text":"u = inside an enclosed space or a city/country: u kući, u stanu, u gradu, u Bosni, u Americi, u školi, u autu."},{"t":"p","text":"na = surfaces, open spaces, events, and a set of \"institution\" words you just have to learn: na stolu, na ulici, na koncertu, na fakultetu, na poslu, na pijaci, na stanici, na moru, na aerodromu, na Baščaršiji, na internetu."},{"t":"h2","text":"Other uses of the locative"},{"t":"p","text":"1.  o (about): Pričamo o muzici. Knjiga o historiji. Razmišljam o tebi."},{"t":"p","text":"2.  po (around / along): Šetam po gradu. Vozim se po Bosni."},{"t":"p","text":"3.  pri (at, near – less common): pri ruci (at hand)."},{"t":"h2","text":"Verbs of motion vs. verbs of location"},{"t":"table","header":["Motion (→ accusative)","Location (→ locative)"],"rows":[["ići (to go) – idem, ideš, ide, idemo, idete, idu","biti (to be) – sam, si, je, smo, ste, su"],["doći (to come) – dođem, dođeš, dođe…","živjeti (to live) – živim, živiš, živi…"],["putovati (to travel) – putujem, putuješ…","raditi (to work) – radim, radiš…"],["voziti se (to drive/ride) – vozim se…","sjediti (to sit) – sjedim, sjediš…"],["ulaziti (to enter) – ulazim, ulaziš…","stanovati (to reside) – stanujem…"],["staviti (to put) – stavim, staviš…","ostati (to stay) – ostanem, ostaneš…"]]},{"t":"h2","text":"Vocabulary"},{"t":"vocab","rows":[["škola (f; loc. školi)","school"],["predavanje (n)","lecture"],["historija (f)","history"],["baka (f)","grandmother"],["tetka (f)","aunt"],["pijaca (f; loc. pijaci)","open market"],["prodavnica (f)","shop"],["kafana (f)","café, coffee house"],["banka (f; loc. banci)","bank"],["more (n)","sea"],["planina (f)","mountain"],["klupa (f)","bench"],["apoteka (f; loc. apoteci)","pharmacy"],["pošta (f)","post office"],["internet (m)","internet"],["muzika (f; loc. muzici)","music"],["pričati, pričam","to talk, tell"],["razmišljati, razmišljam","to think (about)"],["šetati, šetam","to walk, stroll"],["vraćati se, vraćam se","to return"]]},{"t":"h3","text":"Words for talking · Places in town"},{"t":"vocab","rows":[["trg (m)","square"],["most, mosta (m)","bridge"],["džamija (f)","mosque"],["crkva (f)","church"],["bolnica (f)","hospital"],["hotel (m)","hotel"],["restoran (m)","restaurant"],["kino (n)","cinema"],["pozorište (n)","theatre"],["muzej (m)","museum"],["biblioteka (f)","library"],["stadion (m)","stadium"],["tržni centar (m)","shopping centre"],["policija (f)","police"],["ugao, ugla (m)","corner"],["centar, centra (m)","centre"]]},{"t":"ex","title":"Exercise 4A – Locative or accusative? Fill in the correct form","items":["Živim u ___ (Ilidža).","Idem u ___ (Ilidža).","Radim na ___ (fakultet).","Idem na ___ (fakultet).","Djeca su u ___ (škola).","Vozim djecu u ___ (škola).","Sjedim u ___ (auto).","Ulazim u ___ (auto).","Moj brat živi u ___ (Amerika).","Sutra putujem u ___ (Amerika).","Kafa je na ___ (sto – table).","Stavljam kafu na ___ (sto).","Sviram na ___ (koncert) u ___ (Mostar).","Idem na ___ (koncert) u ___ (Mostar)."],"key":["Ilidži","Ilidžu","fakultetu","fakultet","školi","školu","autu","auto","Americi","Ameriku","stolu","sto","koncertu, Mostaru","koncert, Mostar"]},{"t":"ex","title":"Exercise 4B – u or na? Choose and add the locative ending","items":["Radim ___ (banka).","Živim ___ (stan).","Kupujem voće ___ (pijaca – market).","Čekam ___ (stanica).","Ljetujemo ___ (more – sea).","Djeca su ___ (park).","Sjedim ___ (kafana – café).","Ona je ___ (posao).","Šetam ___ (Baščaršija).","Tražim informacije ___ (internet)."],"key":["u banci","u stanu","na pijaci","na stanici","na moru","u parku","u kafani","na poslu","po Baščaršiji (or na Baščaršiji)","na internetu"]},{"t":"ex","title":"Exercise 4C – Translate into Bosnian","items":["I live in Ilidža but I study in Sarajevo.","Every morning I drive to the university.","We are talking about music.","My children are at school.","I am going to the market to buy fruit. (fruit = voće)","On Saturday I am playing at a concert in Mostar.","I am walking around the city with my wife. (with my wife = sa ženom)","The keys are on the table.","I am thinking about my family in America.","We are going to the sea in July. (July = juli → u julu)"],"key":["Živim u Ilidži, ali studiram u Sarajevu.","Svako jutro vozim (se) na fakultet.","Pričamo / Razgovaramo o muzici.","Moja djeca su u školi.","Idem na pijacu da kupim voće. (or: kupiti voće)","U subotu sviram na koncertu u Mostaru.","Šetam po gradu sa ženom.","Ključevi su na stolu.","Razmišljam o (svojoj) porodici u Americi.","Idemo na more u julu."]},{"t":"ex","title":"Exercise 4D – Match the place to what you do there, then say it with u or na + locative","items":["Match: 1. banka   2. pijaca   3. fakultet   4. kafana   5. more   6. kuhinja"],"key":["banka–f u banci, pijaca–e na pijaci, fakultet–d na fakultetu, kafana–b u kafani, more–c na moru, kuhinja–a u kuhinji"],"intro":"Choose from: a. kuham (I cook)   b. pijem kafu   c. plivam (I swim)   d. imam predavanja   e. kupujem voće   f. mijenjam novac (I change money)"},{"t":"ex","title":"Exercise 4E – Complete the dialogue: a phone call","items":["Emir: Adame, gdje si? — Adam: U ___ (kafana) na ___ (Baščaršija).","Emir: A gdje je Amina? — Adam: Ona je na ___ (posao), u ___ (škola).","Emir: Idem u ___ (grad). Dolazim kod tebe! (I'm coming to you)","Adam: Super. Sjedim pored ___ (prozor – gen.) i pričam sa konobarom o ___ (fudbal – football).","Emir: Vidimo se za deset minuta ___ (Sebilj – \"at the Sebilj\" = kod + gen.)."],"key":["kafani, Baščaršiji","poslu, školi","grad","prozora, fudbalu","kod Sebilja"]},{"t":"note","text":"Going somewhere – in the past. The motion verbs of this unit have irregular past forms you will hear constantly: ići → išao sam / išla sam (I went), doći → došao sam / došla sam (I came), otići → otišao / otišla (I left). Try them with the accusative of motion: Jučer sam išao u grad. Došla sam na fakultet u osam.","label":"Preview"},{"t":"culture","title":"Baščaršija","text":"The old bazaar has been Sarajevo's heart since the 1460s. You go na Baščaršiju, not u Baščaršiju – it counts as an open space, like a square. The Sebilj fountain in the middle is where locals arrange to meet: \"Vidimo se kod Sebilja.\""},{"t":"h2","text":"Mini reading"},{"t":"p","text":"Ujutro sam u stanu i pijem kafu. U osam idem na fakultet. Fakultet je u centru grada. Na fakultetu imam predavanja o historiji. Poslije predavanja idem na Baščaršiju i sjedim u kafani. Navečer se vraćam u Ilidžu. Vikendom idemo na planinu ili šetamo po gradu.","italic":true},{"t":"ex","title":"Exercise 4F – Answer","items":["Where is the university?","What are the lectures about?","Where does he sit after lectures?","What do they do on weekends?","Find every preposition + LOCATIVE and every u/na + ACCUSATIVE in the text."],"key":["In the city centre.","History.","In a café (kafana).","Go to the mountain or walk around the city.","Locative: u stanu, na fakultetu, u centru, o historiji, u kafani, (po gradu). Accusative: na fakultet, na Baščaršiju, u Ilidžu, na planinu."]},{"t":"ex","title":"Extra practice – Mixed review","items":["Djeca se igraju u ___ (park), a ja sjedim na ___ (klupa – bench).","Idem u ___ (apoteka) i u ___ (pošta – post office).","Ključevi su u ___ (torba), a torba je u ___ (auto).","Pričamo o ___ (posao) i o ___ (djeca).","Translate: \"My parents live in Tuzla.\" (Tuzla → u Tuzli)","Translate: \"I am at the doctor's.\" (kod + genitive)","Translate: \"We are going to Croatia in the summer.\" (Hrvatska)","Translate: \"The book is about Sarajevo.\"","u or na? ___ kafani, ___ Baščaršiji, ___ stanu, ___ poslu, ___ Igmanu (a mountain), ___ Ilidži","Fix: \"Radim u banka u centar.\""],"key":["parku, klupi","apoteku, poštu","torbi, autu","poslu, djeci","Moji roditelji žive u Tuzli.","Kod ljekara sam.","Idemo u Hrvatsku ljeti / na ljeto.","Knjiga je o Sarajevu.","u kafani, na Baščaršiji, u stanu, na poslu, na Igmanu, u Ilidži","Radim u banci u centru."]},{"t":"ex","title":"From earlier units – Units 1–3","items":["Genitive: kuća ___ (moj brat)","Accusative: Kupujem ___ (kafa) i ___ (hljeb).","Pet ___ (godina) or pet ___ (godine)?","Plural of: stan, pjesma","Vocative of gospođa"],"key":["mog brata","kafu, hljeb","pet godina","stanovi, pjesme","gospođo"]},{"t":"ex","title":"Exercise 4G – About you","items":["About you. Write six sentences about a normal day: where you are in the morning (Ujutro sam u/na…), where you go (Idem u/na…), where you work or study, where you have lunch, where you go in the evening, and one thing you like to talk about (Volim pričati o…)."],"key":["Free writing. Check every u/na: location → locative (-u / -i), movement → accusative (-u / no change)."]},{"t":"mistakes","items":["Mixing location and movement: \"Živim u Sarajevo\" → Živim u Sarajevu; \"Idem u Sarajevu\" → Idem u Sarajevo.","Forgetting the k/g/h → c/z/s change: \"u Ameriki\" → u Americi; \"u banki\" → u banci.","Using u for na-words: \"u fakultetu\", \"u poslu\", \"u koncertu\" → na fakultetu, na poslu, na koncertu."]},{"t":"cando","items":["say where you live, work and study","say \"I am at the concert\" and \"I am going to the concert\"","list five places that take na","say \"we are talking about music\""]}]},{"id":"5","title":"The Dative","full":"Unit 5 – To whom · towards · how I feel","blocks":[{"t":"p","text":"The dative marks the person who receives something or benefits from an action – the \"to\" in \"give it to her\", \"say to him\", \"help him\". It is also the case of most pronouns you hear every day: mi, ti, mu, joj, nam, vam, im."},{"t":"objectives","items":["Say to whom you give, tell, send or show something","Use the dative pronouns mi, ti, mu, joj, nam, vam, im","Say \"I like\" with sviđati se and \"I need\" with trebati","Express feelings: hladno mi je, žao mi je, drago mi je"]},{"t":"h2","text":"Start here – Poklon (A gift)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Adam","Emire, trebam savjet. Šta da kupim ženi za rođendan?"],["Emir","Sviđa li joj se zlato?"],["Adam","Ne baš. Više joj se sviđaju knjige i muzika."],["Emir","Onda joj kupi kartu za koncert i pošalji joj cvijeće na posao."],["Adam","Odlična ideja. Hvala ti!"],["Emir","Nema na čemu. Javi mi kako je prošlo."]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the dialogue again with the changes in the Say-it-again exercise."},{"t":"ex","title":"Exercise 5N – Notice","items":["Find every \"joj\". Who is it referring to, and what case is it?","\"Šta da kupim ženi\" – what case is ženi, and what English word is hidden in it?","In \"Sviđa li joj se zlato\", what is the grammatical subject?"],"key":["joj = to her (Amina) – dative pronoun, short form.","Dative singular; the hidden word is \"to/for\" – I buy (something) for my wife.","zlato – the thing liked is the subject; the person is in the dative."]},{"t":"ex","title":"Exercise 5S – Say it again: change the words in the dialogue","items":["Adam needs a gift for his brother (brat) instead: \"Šta da kupim ___ za rođendan?\" – Emir asks: \"Sviđa li ___ se muzika?\"","The brother prefers books and films: \"Više ___ se sviđaju knjige i filmovi.\"","Emir suggests sending him a message: \"Pošalji ___ poruku.\"","Adam thanks Emir formally: \"Hvala ___!\""],"key":["Šta da kupim bratu za rođendan? – Sviđa li mu se muzika?","Više mu se sviđaju knjige i filmovi.","Pošalji mu poruku.","Hvala vam!"]},{"t":"h2","text":"The grammar behind it"},{"t":"h2","text":"The endings"},{"t":"table","header":["Noun type","Singular","Plural","Example"],"rows":[["Masculine","-u","-ima","brat → bratu → braći (irreg.); prijatelj → prijatelju → prijateljima"],["Neuter","-u","-ima","dijete → djetetu → djeci; selo → selu → selima"],["Feminine -a","-i","-ama","žena → ženi → ženama; sestra → sestri → sestrama"],["Feminine consonant","-i","-ima","stvar → stvari → stvarima"]]},{"t":"note","text":"Good news: the dative and locative endings are identical for nouns. If you know \"u Sarajevu\", you know \"Sarajevu\" in the dative. The same k/g/h → c/z/s change applies: majka → majci, knjiga → knjizi. Adjectives: masculine/neuter -om (dobrom, mom), feminine -oj (dobroj, mojoj)."},{"t":"h2","text":"Four jobs of the dative"},{"t":"p","text":"1.  The receiver (indirect object) with verbs of giving, telling, sending, showing: dati (give), reći / kazati (say), poslati (send), pokazati (show), kupiti (buy for), donijeti (bring), pisati (write to), objasniti (explain). Dajem poklon sestri. Kažem bratu istinu. Šaljem poruku ženi."},{"t":"p","text":"2.  Verbs that always take the dative: pomoći / pomagati (help), vjerovati (believe), zahvaliti (thank), javiti se (get in touch), smetati (bother), trebati (need – \"meni treba\"), sviđati se (like – see below). Pomažem komšiji. Vjerujem ti. Javi mi se!"},{"t":"p","text":"3.  Motion towards a person or a place's direction, with k / ka or prema: Idem ka gradu. Idem ljekaru (to the doctor). Prema centru (towards the centre)."},{"t":"p","text":"4.  Feelings and states with \"to me\": Hladno mi je (I am cold – literally \"it is cold to me\"). Dosadno mi je (I am bored). Drago mi je (pleased to meet you). Žao mi je (I am sorry). Sviđa mi se Sarajevo (I like Sarajevo – \"Sarajevo pleases to me\")."},{"t":"h2","text":"Dative pronouns – learn these by heart"},{"t":"table","header":["Person","Short (unstressed)","Long (stressed / after prepositions)","Example"],"rows":[["ja","mi","meni","Daj mi kafu. / Meni je hladno."],["ti","ti","tebi","Kažem ti. / Tebi vjerujem."],["on / ono","mu","njemu","Pomažem mu. / Njemu je dosadno."],["ona","joj","njoj","Šaljem joj poruku. / Njoj se sviđa."],["mi","nam","nama","Drago nam je. / Dođi k nama."],["vi","vam","vama","Hvala vam. / Vama je lako."],["oni / one / ona","im","njima","Kupujem im sok. / Idem k njima."],["sebe (oneself)","si","sebi","Kupujem sebi gitaru."]]},{"t":"note","text":"Short forms are clitics: they sit in second position, like sam/si/je. When several clitics meet, the order is: sam/si/smo/ste → dative → accusative → je. So \"Dao sam ti ga\" (I gave it to you) but \"Dala mi ga je\" (she gave it to me) – je always goes last."},{"t":"h2","text":"Sviđati se – the everyday way to say \"like\""},{"t":"p","text":"Voljeti = to love, or to like in general (Volim kafu). Sviđati se = to like something specific, especially on first meeting it; the thing liked is the subject and the person is in the dative: Sviđa mi se ova pjesma. Sviđaju mi se tvoje cipele (plural verb!). Sviđa li ti se Sarajevo? Ne sviđa mu se ova kafana."},{"t":"h2","text":"Vocabulary"},{"t":"vocab","rows":[["dati, dam / davati, dajem","to give"],["otac, oca / tata (m)","father / dad"],["reći, reknem (kažem) / kazati, kažem","to say, tell"],["baka / djed (f/m)","grandma / grandpa"],["poslati, pošaljem / slati, šaljem","to send"],["poklon (m)","gift"],["pokazati, pokažem","to show"],["poruka (f)","message"],["donijeti, donesem","to bring"],["pismo (n)","letter"],["pomoći, pomognem / pomagati, pomažem","to help"],["istina (f)","truth"],["vjerovati, vjerujem","to believe"],["savjet (m)","advice"],["zahvaliti, zahvalim","to thank"],["drago mi je","pleased to meet you"],["javiti se, javim se","to get in touch"],["žao mi je","I'm sorry"],["objasniti, objasnim","to explain"],["hladno / vruće mi je","I'm cold / hot"],["ljekar, ljekara / doktor (m)","doctor"],["dosadno mi je","I'm bored"],["učitelj / učiteljica (m/f)","teacher (m / f)"],["treba mi","I need"],["majka / mama (f)","mother / mum"],["rođendan (m)","birthday"],["cvijeće (n)","flowers"],["karta (f)","ticket"],["zadaća (f)","homework"],["sveska (f)","notebook"],["nedostajati, nedostajem","to be missed (nedostaješ mi = I miss you)"]]},{"t":"h3","text":"Words for talking · Body and health"},{"t":"vocab","rows":[["glava (f)","head"],["oko (n; pl. oči)","eye"],["uho (n; pl. uši)","ear"],["zub (m; pl. zubi)","tooth"],["grlo (n)","throat"],["stomak, stomaka (m)","stomach"],["leđa (n, plural)","back"],["noga (f; loc. nozi)","leg, foot"],["ruka (f; loc. ruci)","arm, hand"],["srce (n)","heart"],["bolestan / bolesna","ill"],["zdrav / zdrava","healthy"],["boljeti, boli","to hurt (Boli me glava = my head hurts)"],["temperatura (f)","fever, temperature"],["lijek (m)","medicine"],["bolnica (f)","hospital"],["Kako ste? / Kako si?","How are you? (formal / informal)"]]},{"t":"ex","title":"Exercise 5A – Put the noun in the dative","items":["Dajem poklon ___ (sestra).","Kažem ___ (brat) istinu.","Šaljem poruku ___ (žena).","Pomažem ___ (komšija) u bašti. (bašta = garden)","Kupujem sok ___ (djeca).","Pišem pismo ___ (baka).","Idem ___ (ljekar) sutra.","Objašnjavam gramatiku ___ (prijatelj).","Donosim kafu ___ (majka).","Pokazujem grad ___ (turisti – tourists, plural).","Hvala ___ (učiteljica) na pomoći.","Vjerujem ___ (moj muž)."],"key":["sestri","bratu","ženi","komšiji","djeci","baki","ljekaru","prijatelju","majci","turistima","učiteljici","mom mužu"]},{"t":"ex","title":"Exercise 5B – Fill in the dative pronoun (short form)","items":["Daj ___ kafu, molim te. (me)","Kažem ___ da je kasno. (you, informal)","Pomažem ___ svaki dan. (him)","Šaljem ___ poruku. (her)","Drago ___ je. (us)","Hvala ___ na svemu. (you, formal)","Kupujem ___ sladoled. (them)","Hladno ___ je. (me)","Sviđa ___ se ova pjesma. (me)","Sviđaju ___ se tvoje cipele. (her)"],"key":["mi","ti","mu","joj","nam","vam","im","mi","mi","joj"]},{"t":"ex","title":"Exercise 5C – Translate into Bosnian","items":["I am giving my sister a book.","Tell me the truth. (informal; tell = reci)","I help my neighbour every Saturday.","I am sending a message to my wife.","I am cold. She is hot.","Pleased to meet you. (formal)","I like this song. (sviđati se)","I like your shoes. (informal, plural)","I am going to the doctor tomorrow.","Thank you for the coffee. (formal; for = na + locative → na kafi)","I am sorry, I don't have time.","I need a new phone. (treba mi)"],"key":["Dajem sestri knjigu.","Reci mi istinu.","Pomažem komšiji svake subote.","Šaljem poruku ženi.","Hladno mi je. Njoj je vruće. / Vruće joj je.","Drago mi je.","Sviđa mi se ova pjesma.","Sviđaju mi se tvoje cipele.","Idem ljekaru sutra. / Sutra idem kod ljekara.","Hvala vam na kafi.","Žao mi je, nemam vremena.","Treba mi nov telefon."]},{"t":"ex","title":"Exercise 5D – Match the feeling to the situation","items":["Match: 1. Hladno mi je.   2. Žao mi je.   3. Drago mi je.   4. Dosadno mi je.   5. Vruće mi je.   6. Treba mi odmor."],"key":["Hladno–f, Žao–d, Drago–a, Dosadno–e, Vruće–b, Treba mi odmor–c"],"intro":"Choose from: a. You meet someone for the first time.   b. It is August in Mostar.   c. You have worked ten days in a row.   d. You forgot a friend's birthday.   e. The film is two hours of nothing.   f. Snow, and no jacket."},{"t":"ex","title":"Exercise 5E – Complete the dialogue: at the doctor's","items":["Ljekar: Dobar dan. Šta ___ je? (\"what is wrong with you\" – vam)","Adam: Boli ___ glava i grlo. (me – accusative here: boli me)","Ljekar: Imate li temperaturu? — Adam: Da, i hladno ___ je. (me)","Ljekar: Dat ću ___ lijek. Pijte mnogo čaja. (you, formal)","Adam: Hvala ___, doktore. (you, formal)","Ljekar: Nema na čemu. Javite ___ se za tri dana. (me)"],"key":["vam","me","mi","vam","vam","mi"]},{"t":"note","text":"The future in one small word. To promise or plan, put ću / ćeš / će in second position and add the infinitive: Sutra ću ti pomoći (I will help you tomorrow). Poslat ću joj poruku (I will send her a message). Unit 8 covers the whole system; the dative pronouns of this unit are exactly what you need to start using it.","label":"Preview"},{"t":"culture","title":"Bujrum","text":"When a Bosnian host puts food in front of you, they say \"bujrum\" – help yourself, welcome. Politeness runs on the dative: Drago mi je (pleased to meet you), Hvala vam (thank you), Oprostite mi (forgive me), Nazdravlje (bless you – said to the sneezer, who answers Hvala). Refuse a second helping once for form's sake; the third time, say \"može\" and eat."},{"t":"h2","text":"Reading – Subota"},{"t":"p","text":"Subota je. Adam pomaže komšiji Mirsadu da popravi auto. Mirsad mu pokazuje motor i objašnjava mu problem, a Adam mu dodaje alat. Poslije toga Adam ide u prodavnicu i kupuje ženi cvijeće, a djeci čokoladu. Kod kuće daje poklone: \"Amina, ovo je za tebe. Djeco, ovo je za vas.\" Amina kaže: \"Hvala ti, Adame. Drago mi je.\" Najmlađi sin pita: \"Tata, možeš li mi pomoći sa zadaćom?\" Adam mu odgovara: \"Naravno, sine. Prvo mi donesi svesku.\" Kćerka im donosi sok i kaže da joj je dosadno. Amina joj daje knjigu. Navečer Adam šalje poruku bratu u Ameriku: \"Sviđa mi se život ovdje. Komšije nam pomažu, djeci se sviđa škola. Nedostaješ mi. Javi mi se kad možeš.\"","italic":true},{"t":"ex","title":"Exercise 5F – Answer","items":["Who does Adam help, and with what?","What does he buy, and for whom?","What does the youngest son ask?","What does the daughter say, and what does Amina do?","What does Adam write to his brother?","List every dative noun and pronoun in the text (there are at least 16)."],"key":["His neighbour Mirsad, fixing a car.","Flowers for his wife, chocolate for the children.","Whether Dad can help him with homework.","That she is bored; Amina gives her a book.","That he likes life here, the neighbours help them, the children like school, and he misses him.","komšiji, Mirsadu, mu, mu, mu, ženi, djeci, ti, mi, mi, mu, mi, im, joj, joj, bratu, mi, nam, djeci, mi, mi"]},{"t":"ex","title":"Extra practice – Mixed review","items":["Kupujem cvijeće ___ (majka) i čokoladu ___ (djeca).","Pišem ___ (prijateljica) u Zagrebu.","Pomozi ___ (ja)! Objasni ___ (mi – we) zadatak.","Sviđa ___ (ti) ovaj grad? – Da, sviđa ___ (ja) se.","Translate: \"I need help.\" (pomoć, f)","Translate: \"Is he bored?\" (dosadno)","Translate: \"Tell her that I am coming.\" (reci; that = da; I am coming = dolazim)","Translate: \"We are going towards the river.\" (prema)","Translate: \"Thank you (formal) for the gift.\"","Fix: \"Dajem poklon moj brat.\""],"key":["majci, djeci","prijateljici","Pomozi mi! Objasni nam zadatak.","ti, mi","Treba mi pomoć.","Je li mu dosadno? / Da li mu je dosadno?","Reci joj da dolazim.","Idemo prema rijeci.","Hvala vam na poklonu.","Dajem poklon mom bratu / svom bratu."]},{"t":"ex","title":"From earlier units – Units 1–4","items":["Locative or accusative? Idem u ___ (škola). Djeca su u ___ (škola).","Genitive: Ovo je auto ___ (moja sestra).","Accusative: Vidim ___ (prijatelj).","Plural of: muž, ime","Dvije ___ (kafa) or dvije ___ (kafe)?"],"key":["školu, školi","moje sestre","prijatelja","muževi, imena","dvije kafe"]},{"t":"ex","title":"Exercise 5G – About you","items":["About you. Write five sentences: what you like (Sviđa mi se… / Sviđaju mi se…), what you need this week (Treba mi…), who you help (Pomažem…), who you send messages to (Šaljem poruke…), and how you feel right now (…mi je)."],"key":["Free writing. Check: the person is in the dative, the thing liked is the subject (plural verb for plural things)."]},{"t":"mistakes","items":["Using the accusative for the receiver: \"Dajem knjigu sestru\" → Dajem knjigu sestri.","Putting the person as the subject of sviđati se: \"Ja sviđam se Sarajevo\" → Sviđa mi se Sarajevo (Sarajevo is the subject).","Starting a sentence with a clitic: \"Mi je hladno\" → Hladno mi je / Meni je hladno."]},{"t":"cando","items":["say \"I am giving my sister a book\"","say \"I like this song\" and \"I like these shoes\"","say \"I am cold\", \"I am sorry\", \"pleased to meet you\"","say \"help me\", \"tell me\", \"give me\""]}]},{"id":"6","title":"The Instrumental","full":"Unit 6 – With whom · by what","blocks":[{"t":"p","text":"The instrumental answers two questions: with whom? (sa + instrumental) and by what means? (instrumental with NO preposition)."},{"t":"objectives","items":["Say who you do things with (sa + instrumental)","Say how you travel and what you use (instrumental without sa)","Use the instrumental pronouns sa mnom, s tobom, s njim, s njom, s nama"]},{"t":"h2","text":"Start here – Kako ideš na posao? (How do you get to work?)"},{"t":"p","text":"Read the dialogue first, before the rules. You will meet this unit's grammar in use; the explanation that follows tells you what you just read."},{"t":"dialogue","title":"","lines":[["Mirsad","Adame, kako ideš na fakultet? Autom?"],["Adam","Ne, tramvajem. Auto ostavljam ženi."],["Mirsad","Ja idem autobusom, a ponekad pješke."],["Adam","A vikendom? Šta radiš?"],["Mirsad","Subotom idem na pijacu sa ženom, a nedjeljom pijem kafu sa prijateljima."],["Adam","Dođi sljedeće nedjelje sa mnom na probu. Sviram sa bendom."]]},{"t":"p","text":"Read it aloud twice. Then answer the Notice questions – they point at the grammar this unit teaches – and say the
