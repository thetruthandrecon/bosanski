      case 'objectives': h += `<div class="box obj"><div class="lbl">IN THIS UNIT YOU WILL LEARN TO</div><ul>${b.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`; break;
      case 'mistakes': h += `<div class="box mis"><div class="lbl">COMMON MISTAKES</div><ul>${b.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`; break;
      case 'cando': h += `<div class="box can"><div class="lbl">CAN YOU…? Tick each one you can do without looking back.</div>${b.items.map((i, k) => `<label><input type="checkbox" data-k="c_${id}_${bi}_${k}" ${S.get(`c_${id}_${bi}_${k}`) ? 'checked' : ''}> <span>${esc(i)}</span></label>`).join('')}</div>`; break;
      case 'dialogue': h += `${b.title ? `<h2>${esc(b.title)}</h2>` : ''}<div class="tbl"><table class="dlg">${b.lines.map(([w, l]) => `<tr><td>${esc(w)}:</td><td>${esc(l)}</td></tr>`).join('')}</table></div>`; break;
      case 'ex': {
        h += `<div class="ex" data-bi="${bi}"><h3>${esc(b.title)}</h3>${b.intro ? `<p class="small" style="margin:0 0 8px">${esc(b.intro)}</p>` : ''}`;
        h += `<div class="kbd">${['č','ć','š','ž','đ'].map(c => `<button type="button" data-c="${c}">${c}</button>`).join('')}<span class="small" style="align-self:center;margin-left:4px">tap to insert</span></div>`;
        b.items.forEach((it, ii) => {
          const k = `${id}_${bi}_${ii}`; const val = S.get('a_' + k, ''); const st = S.get('m_' + k, '');
          h += `<div class="item ${st} ${st ? 'show' : ''}" data-k="${k}"><div class="q"><span class="num">${ii + 1}.</span>${esc(it)}</div><textarea rows="1" placeholder="Type your answer…">${esc(val)}</textarea><div class="ans"><b>Answer:</b> ${esc(b.key[ii] || '—')}</div><div class="self"><button data-m="ok">✓ I had it right</button><button data-m="bad">✗ I missed it</button></div></div>`;
        });
        h += `<div class="row"><button class="btn p" data-act="check">Check answers</button><button class="btn s" data-act="reset">Reset</button></div><div class="score"></div></div>`;
        break;
      }
    }
  });
  document.getElementById('main').innerHTML = h; window.scrollTo(0, 0);
  const m = document.getElementById('main');
  m.querySelectorAll('textarea').forEach(t => { fit(t); t.addEventListener('input', () => { fit(t); S.set('a_' + t.closest('.item').dataset.k, t.value); }); });
  m.querySelectorAll('.kbd button').forEach(bt => bt.onclick = () => { const ta = m.querySelector('textarea:focus') || lastTA; if (!ta) return; const s = ta.selectionStart, e = ta.selectionEnd; ta.value = ta.value.slice(0, s) + bt.dataset.c + ta.value.slice(e); ta.selectionStart = ta.selectionEnd = s + 1; ta.focus(); ta.dispatchEvent(new Event('input')); });
  m.querySelectorAll('textarea').forEach(t => t.addEventListener('focus', () => lastTA = t));
  m.querySelectorAll('.can input').forEach(c => c.onchange = () => S.set(c.dataset.k, c.checked));
  m.querySelectorAll('.ex').forEach(ex => {
    const bi = +ex.dataset.bi, b = sec.blocks[bi];
    ex.querySelector('[data-act=check]').onclick = () => {
      ex.querySelectorAll('.item').forEach((el, ii) => { const ta = el.querySelector('textarea'); el.classList.add('show'); if (!ta.value.trim()) { el.classList.remove('ok','bad'); return; } const ok = matches(ta.value, b.key[ii] || ''); el.classList.toggle('ok', ok); el.classList.toggle('bad', !ok); S.set('m_' + el.dataset.k, ok ? 'ok' : 'bad'); });
      score(ex);
    };
    ex.querySelector('[data-act=reset]').onclick = () => { ex.querySelectorAll('.item').forEach(el => { el.classList.remove('show', 'ok', 'bad'); el.querySelector('textarea').value = ''; S.set('a_' + el.dataset.k, ''); S.set('m_' + el.dataset.k, ''); }); ex.querySelector('.score').textContent = ''; };
    ex.querySelectorAll('.self button').forEach(bt => bt.onclick = () => { const el = bt.closest('.item'); const ok = bt.dataset.m === 'ok'; el.classList.toggle('ok', ok); el.classList.toggle('bad', !ok); S.set('m_' + el.dataset.k, ok ? 'ok' : 'bad'); score(ex); });
    score(ex);
  });
}
let lastTA = null;
function fit(t) { t.style.height = 'auto'; t.style.height = Math.max(44, t.scrollHeight) + 'px'; }
function score(ex) { const items = ex.querySelectorAll('.item.show'); if (!items.length) return; const ok = ex.querySelectorAll('.item.ok').length; ex.querySelector('.score').textContent = `${ok} / ${ex.querySelectorAll('.item').length} correct`; }
function go(id) { location.hash = id; }
function route() { const id = location.hash.replace('#', ''); document.body.style.fontSize = settings.font + 'px'; if (id === 'settings') return settingsView(); if (id && order.includes(id)) render(id); else home(); }
function settingsView() {
  document.getElementById('nav').style.display = 'none'; document.getElementById('back').style.visibility = 'visible'; document.getElementById('title').textContent = 'Settings';
  document.getElementById('main').innerHTML = `<div class="card settings"><label>Accept answers without diacritics (c = č, s = š…)<input type="checkbox" id="len" ${settings.lenient ? 'checked' : ''}></label><label>Text size<select id="fs"><option ${settings.font==15?'selected':''}>15</option><option ${settings.font==17?'selected':''}>17</option><option ${settings.font==19?'selected':''}>19</option><option ${settings.font==21?'selected':''}>21</option></select></label><label>Clear all saved answers and progress<button class="btn s" id="clr" style="flex:0;padding:8px 14px">Clear</button></label></div><p class="small">Answers are checked automatically where wording is fixed (endings, verb forms). For translations, several correct versions exist – compare yours with the model answer and mark it yourself.</p><p class="small">Found a mistake? Please mention it in your Amazon review so it can be fixed in the next edition.</p>`;
  document.getElementById('len').onchange = e => { settings.lenient = e.target.checked; S.set('settings', settings); };
  document.getElementById('fs').onchange = e => { settings.font = +e.target.value; S.set('settings', settings); document.body.style.fontSize = settings.font + 'px'; };
  document.getElementById('clr').onclick = () => { if (confirm('Delete all your answers and progress?')) { Object.keys(localStorage).filter(k => k.startsWith('bos_') && k !== 'bos_settings').forEach(k => localStorage.removeItem(k)); alert('Cleared.'); } };
}
document.getElementById('back').onclick = () => { history.length > 1 ? history.back() : go(''); };
document.getElementById('home2').onclick = () => go('');
document.getElementById('gear').onclick = () => go('settings');
document.getElementById('prev').onclick = () => { const i = order.indexOf(location.hash.slice(1)); if (i > 0) go(order[i - 1]); };
document.getElementById('next').onclick = () => { const i = order.indexOf(location.hash.slice(1)); if (i < order.length - 1) go(order[i + 1]); };
window.addEventListener('hashchange', route); route();
</script>
</body>
